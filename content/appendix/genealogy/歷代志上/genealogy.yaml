sections:

# ───────────────────────── 第 1 章 ─────────────────────────
- id: c1a
  chapter: 1
  title: 亞當到挪亞
  range: "1:1-4"
  intro: 第一章一開頭就從人類的始祖寫起，十代人只用了四節。
  spine: [亞當, 挪亞]
  statements:
    - ref: "1:1-4"
      new_root: true
      chain: [{id: 亞當, mark: main}, {id: 塞特, mark: main}, {id: 以挪士, mark: main}, {id: 該南, mark: main}, {id: 瑪勒列, mark: main}, {id: 雅列, mark: main}, {id: 以諾, mark: main}, {id: 瑪土撒拉, mark: main}, {id: 拉麥, mark: main}, {id: 挪亞, mark: main}]
    - ref: "1:4"
      parent: 挪亞
      children: [{id: 閃, mark: main}, 含, 雅弗]
  notes:
    - text: 1:4 照「閃、含、雅弗」的次序列出，接下來卻倒過來寫：先雅弗（1:5–7），再含（1:8–16），最後才是閃（1:17 起）。
      refs: "1:4"

- id: c1b
  chapter: 1
  title: 雅弗的後代
  range: "1:5-7"
  intro: 雅弗的七個兒子和兩支孫輩。
  statements:
    - ref: "1:5"
      parent: 雅弗
      children: [歌篾, 瑪各, 瑪代, 雅完, 土巴, 米設, 提拉]
    - ref: "1:6"
      parent: 歌篾
      children: [亞實基拿, 低法, 陀迦瑪]
    - ref: "1:7"
      parent: 雅完
      children: [以利沙, 他施, 基提, 多單]

- id: c1c
  chapter: 1
  title: 含的後代
  range: "1:8-16"
  intro: 含的四個兒子：古實、麥西、弗、迦南。麥西和迦南名下列的多半是民族名（「某某人」）。
  statements:
    - ref: "1:8"
      parent: 含
      children: [古實, 麥西, 弗, 迦南]
    - ref: "1:9"
      parent: 古實
      children: [西巴, 哈腓拉, 撒弗他, 拉瑪, 撒弗提迦]
    - ref: "1:9"
      parent: 拉瑪
      children: [示巴#拉瑪, 底但#拉瑪]
    - ref: "1:10"
      parent: 古實
      children: [{id: 寧錄, note: "「他為世上英雄之首」"}]
    - ref: "1:11-12"
      parent: 麥西
      children: [路低人, 亞拿米人, 利哈比人, 拿弗土希人, 帕斯魯細人, 迦斯路希人, 迦斐託人]
    - ref: "1:12"
      covers: true
      note: 1:12 結尾說：「從迦斐託出來的有非利士人」。
    - ref: "1:13-16"
      parent: 迦南
      children: [{id: 西頓, note: 長子}, 赫, 耶布斯人, 亞摩利人, 革迦撒人, 希未人, 亞基人, 西尼人, 亞瓦底人, 洗瑪利人, 哈馬人]

- id: c1d
  chapter: 1
  title: 閃的後代
  range: "1:17-23"
  intro: 閃的兒子當中，作者後來只沿著亞法撒往下追（1:24–27）。希伯的兒子約坍有十三個兒子。
  statements:
    - ref: "1:17"
      parent: 閃
      children: [以攔, 亞述, {id: 亞法撒, mark: main}, 路德, 亞蘭, 烏斯, 戶勒, 基帖, 米設#閃]
    - ref: "1:18"
      chain: [亞法撒, {id: 沙拉, mark: main}, {id: 希伯, mark: main}]
    - ref: "1:19"
      parent: 希伯
      children: [{id: 法勒, mark: main, note: "名字的意思是「分」，「因為那時人就分地居住」"}, 約坍]
    - ref: "1:20-23"
      parent: 約坍
      children: [亞摩答, 沙列, 哈薩瑪非, 耶拉, 哈多蘭, 烏薩, 德拉, 以巴錄, 亞比瑪利, 示巴#約坍, 阿斐, 哈腓拉#約坍, 約巴]
  notes:
    - text: 1:17 把烏斯、戶勒、基帖、米設直接列在閃的兒子裡；創世記 10:23 說他們是「亞蘭的兒子」。這裡照歷代志上的寫法，掛在閃底下。
      refs: "1:17, 創 10:23"

- id: c1e
  chapter: 1
  title: 閃到亞伯拉罕
  range: "1:24-27"
  intro: 1:24–25 重述閃到法勒的五代，接著一路排到亞伯拉罕。
  spine: [閃, 亞伯拉罕]
  statements:
    - ref: "1:24-25"
      chain: [閃, 亞法撒, 沙拉, 希伯, 法勒]
    - ref: "1:25-27"
      chain: [法勒, {id: 拉吳, mark: main}, {id: 西鹿, mark: main}, {id: 拿鶴, mark: main}, {id: 他拉, mark: main}, {id: 亞伯拉罕, mark: main, note: "「亞伯蘭就是亞伯拉罕」"}]

- id: c1f
  chapter: 1
  title: 亞伯拉罕的兒子
  range: "1:28-34"
  intro: 亞伯拉罕的兒子分三組：以撒和以實瑪利、妾基土拉生的六個兒子，最後回到以撒的兩個兒子。
  statements:
    - ref: "1:28"
      parent: 亞伯拉罕
      children: [{id: 以撒, mark: main}, 以實瑪利]
    - ref: "1:29-31"
      parent: 以實瑪利
      children: [{id: 尼拜約, note: 長子}, 基達, 押德別, 米比衫, 米施瑪, 度瑪, 瑪撒, 哈達, 提瑪, 伊突, 拿非施, 基底瑪]
    - ref: "1:32"
      parent: 亞伯拉罕
      mother: 基土拉
      children: [心蘭, 約珊, 米但, 米甸, 伊施巴, 書亞]
    - ref: "1:32"
      parent: 約珊
      children: [示巴#約珊, 底但#約珊]
    - ref: "1:33"
      parent: 米甸
      children: [以法, 以弗, 哈諾, 亞比大, 以勒大]
    - ref: "1:34"
      parent: 以撒
      children: [以掃, {id: 以色列, mark: main}]
  notes:
    - text: 1:32 稱基土拉是亞伯拉罕的「妾」；創世記 25:1 寫「亞伯拉罕又娶了一妻，名叫基土拉」。
      refs: "1:32, 創 25:1"

- id: c1g
  chapter: 1
  title: 以掃的後代與西珥人
  range: "1:35-42"
  intro: 以掃的五個兒子，接著是西珥的七個兒子和他們的後代。
  statements:
    - ref: "1:35"
      parent: 以掃
      children: [以利法, 流珥, 耶烏施, 雅蘭, 可拉#以掃]
    - ref: "1:36"
      parent: 以利法
      children: [提幔, 阿抹, 洗玻, 迦坦, 基納斯, 亭納, 亞瑪力]
    - ref: "1:37"
      parent: 流珥
      children: [拿哈, 謝拉#流珥, 沙瑪, 米撒]
    - ref: "1:38"
      parent: 西珥
      new_parent: true
      children: [羅坍, 朔巴, 祭便, 亞拿, 底順, 以察, 底珊]
    - ref: "1:39"
      parent: 羅坍
      children: [何利, 荷幔]
    - ref: "1:39"
      parent: 羅坍
      rel: 妹子
      children: [亭納#羅坍]
    - ref: "1:40"
      parent: 朔巴
      children: [亞勒文, 瑪拿轄, 以巴錄#朔巴, 示非, 阿南]
    - ref: "1:40"
      parent: 祭便
      children: [亞雅, 亞拿#祭便]
    - ref: "1:41"
      parent: 亞拿
      children: [底順#亞拿]
    - ref: "1:41"
      parent: 底順
      children: [哈默蘭, 伊是班, 益蘭, 基蘭]
    - ref: "1:42"
      parent: 以察
      children: [辟罕, 撒番, 亞干#以察]
    - ref: "1:42"
      parent: 底珊
      children: [烏斯#底珊, 亞蘭#底珊]
  notes:
    - text: 1:36 把「亭納、亞瑪力」都列為以利法的兒子；創世記 36:12 寫「亭納是以掃兒子以利法的妾；他給以利法生了亞瑪力」。
      refs: "1:36, 創 36:12"
    - text: 1:41「亞拿的兒子是底順。底順的兒子是哈默蘭……」，經文沒有說後一個底順是哪一位。1:39–42 是照西珥七個兒子的次序逐一列出他們的兒子，這裡照這個次序，把哈默蘭等四人掛在西珥的兒子底順名下；照字面也可以讀成亞拿的兒子底順。創世記 36:25–28 的排法相同，同樣沒有說明。
      refs: "1:41"

- id: c1h
  chapter: 1
  title: 以東的王和族長
  range: "1:43-54"
  intro: 「以色列人未有君王治理之先」，以東已經有八個王前後接續。這八人是一個接一個作王，不是父子。王的時代之後，以東由十一個族長分治。
  statements:
    - ref: "1:43"
      roots: [{id: 比拉#以東王, note: 以東第一個王, pnote: 比珥的兒子；京城亭哈巴, check: [比珥, 亭哈巴]}]
    - ref: "1:44"
      roots: [{id: 約巴#以東王, pnote: 波斯拉人謝拉的兒子, check: [波斯拉人謝拉]}]
    - ref: "1:45"
      roots: [{id: 戶珊, pnote: 提幔地的人, check: [提幔地的人]}]
    - ref: "1:46"
      roots: [{id: 哈達#比達, pnote: 比達的兒子；在摩押地殺敗米甸人；京城亞未得, check: [比達, 在摩押地殺敗米甸人, 亞未得]}]
    - ref: "1:47"
      roots: [{id: 桑拉, pnote: 瑪士利加人, check: [瑪士利加人]}]
    - ref: "1:48"
      roots: [{id: 掃羅#利河伯, pnote: 大河邊的利河伯人, check: [大河邊的利河伯人]}]
    - ref: "1:49"
      roots: [{id: 巴勒哈南, pnote: 亞革波的兒子, check: [亞革波]}]
    - ref: "1:50"
      roots: [{id: 哈達#巴伊, pnote: 京城巴伊；妻子米希他別是米薩合的孫女、瑪特列的女兒, check: [巴伊, 米希他別, 米薩合的孫女, 瑪特列的女兒]}]
    - ref: "1:51-54"
      roots: [亭納#族長, 亞勒瓦, 耶帖, 亞何利巴瑪, 以拉#族長, 比嫩, 基納斯#族長, 提幔#族長, 米比薩, 瑪基疊, 以蘭]
      note: 哈達死後，以東改由族長治理；1:51–54 列出十一個族長，結尾說「這都是以東人的族長」。

# ───────────────────────── 第 2 章 ─────────────────────────
- id: c2a
  chapter: 2
  title: 以色列的十二個兒子
  range: "2:1-2"
  intro: 先列出十二個兒子，接著跳過老大流便，從第四個兒子猶大寫起。猶大一族寫到 4:23，是全部族譜裡最長的一段。
  statements:
    - ref: "2:1-2"
      parent: 以色列
      children: [流便, 西緬, 利未, {id: 猶大, mark: main}, 以薩迦, 西布倫, 但, 約瑟, 便雅憫, 拿弗他利, 迦得, 亞設]

- id: c2b
  chapter: 2
  title: 猶大的五個兒子
  range: "2:3-8"
  intro: 猶大的五個兒子來自兩個母親。往下追的是法勒斯；謝拉一支只記到兩代。
  statements:
    - ref: "2:3"
      parent: 猶大
      mother: 迦南人書亞女兒
      children: [{id: 珥, note: "「在耶和華眼中看為惡，耶和華就使他死了」"}, 俄南, 示拉]
    - ref: "2:4"
      parent: 猶大
      mother: 他瑪
      children: [{id: 法勒斯, mark: main}, 謝拉]
    - ref: "2:5"
      parent: 法勒斯
      children: [{id: 希斯崙, mark: main}, 哈母勒]
    - ref: "2:6"
      parent: 謝拉
      children: [心利, 以探#謝拉, 希幔#謝拉, 甲各, 大拉]
    - ref: "2:7"
      parent: 迦米#亞干之父
      parent_as: 迦米
      new_parent: true
      children: [{id: 亞干, note: "「在當滅的物上犯了罪，連累了以色列人」"}]
    - ref: "2:8"
      parent: 以探#謝拉
      parent_as: 以探
      children: [亞撒利雅#以探]
  notes:
    - text: 2:7 沒有說迦米是誰的兒子。約書亞記 7:1 稱亞干是「謝拉的曾孫，撒底的孫子，迦米的兒子」，所以這一家屬於謝拉一支。
      refs: "2:7, 書 7:1"
    - text: 2:6 謝拉的兒子以探、希幔、甲各、大拉，列王紀上 4:31 也有同樣一組名字：「以斯拉人以探，並瑪曷的兒子希幔、甲各、達大」。兩處的父親寫法不同。
      refs: "2:6, 王上 4:31"

- id: c2c
  chapter: 2
  title: 蘭到大衛
  range: "2:9-17"
  intro: 希斯崙有三個兒子。這一段先追老二蘭，九代之後到大衛；耶拉篾和迦勒（基路拜）兩支放在後面。
  spine: [猶大, 大衛]
  statements:
    - ref: "2:9"
      parent: 希斯崙
      children: [耶拉篾, {id: 蘭, mark: main}, 基路拜]
    - ref: "2:10-12"
      chain: [蘭, {id: 亞米拿達, mark: main}, {id: 拿順, mark: main, note: "「作猶大人的首領」"}, {id: 撒門, mark: main}, {id: 波阿斯, mark: main}, {id: 俄備得, mark: main}, {id: 耶西, mark: main}]
    - ref: "2:13-15"
      parent: 耶西
      children: [{id: 以利押, note: 長子}, 亞比拿達, {id: 示米亞, note: 三子}, 拿坦業, 拉代, 阿鮮, {id: 大衛, mark: main, note: 七子}]
    - ref: "2:16"
      parent: 大衛
      parent_in_text: false
      rel: 姊妹
      children: [洗魯雅, 亞比該]
    - ref: "2:16"
      parent: 洗魯雅
      children: [亞比篩, 約押, 亞撒黑]
    - ref: "2:17"
      parent: 亞比該
      children: [{id: 亞瑪撒, note: "父親是「以實瑪利人益帖」"}]
  notes:
    - text: 2:13–15 列出耶西的七個兒子，大衛排第七；撒母耳記上 17:12 說「耶西有八個兒子」。
      refs: "2:13-15, 撒上 17:12"
    - text: 2:16「他們的姊妹是洗魯雅和亞比該」，是大衛兄弟們的姊妹。撒母耳記下 17:25 說亞比該是「拿轄的女兒」。
      refs: "2:16, 撒下 17:25"

