    topics:
      - { id: clean-food, name: 可吃與不可吃, plain: 什麼可以吃, entry: 潔淨與不潔淨 }
      - { id: blood-fat, name: 血與脂油, plain: 血與脂油 }
      - { id: skin-disease, name: 皮膚病與大痲瘋, plain: 皮膚病 }
