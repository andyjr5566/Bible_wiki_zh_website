# ───────────────────────── 第 9 章 ─────────────────────────
- id: c9a
  chapter: 9
  title: 歸回以後住在耶路撒冷的人
  range: "9:1-9"
  intro: 族譜寫到這裡，時間跳到被擄歸回以後。先是猶大和便雅憫的居民。
  statements:
    - ref: "9:1"
      covers: true
      note: 「以色列人都按家譜計算，寫在以色列諸王記上。猶大人因犯罪就被擄到巴比倫」。
    - ref: "9:2-3"
      covers: true
      note: 先回來的有「以色列人、祭司、利未人、尼提寧」；住在耶路撒冷的有「猶大人、便雅憫人、以法蓮人、瑪拿西人」。
    - ref: "9:4"
      new_root: true
      chain: [巴尼#9:4, 音利, 暗利#9:4, 亞米忽#9:4, {id: 烏太, note: 法勒斯的子孫}]
    - ref: "9:5"
      roots: [{id: 亞帥雅#示羅, note: "示羅的子孫中的「長子」，和他的眾子"}]
    - ref: "9:6"
      roots: [{id: 耶烏利, note: "謝拉的子孫；連弟兄「共六百九十人」"}]
    - ref: "9:7"
      new_root: true
      chain: [哈西努, 何達威雅#哈西努, 米書蘭#何達威雅, {id: 撒路, note: 便雅憫人}]
    - ref: "9:8"
      parent: 耶羅罕#9:8
      parent_as: 耶羅罕
      new_parent: true
      children: [伊比尼雅#耶羅罕]
    - ref: "9:8"
      new_root: true
      chain: [米基立, 烏西#米基立, 以拉#烏西]
    - ref: "9:8"
      new_root: true
      chain: [伊比尼雅#流珥之祖, 流珥#9:8, 示法提雅#流珥, 米書蘭#示法提雅]
    - ref: "9:9"
      covers: true
      note: 便雅憫人「按著家譜計算共有九百五十六名」。

- id: c9b
  chapter: 9
  title: 祭司
  range: "9:10-13"
  intro: 歸回後在聖殿供職的祭司家族。
  statements:
    - ref: "9:10"
      roots: [耶大雅, 耶何雅立, 雅斤]
    - ref: "9:11"
      new_root: true
      chain: [亞希突#9:11, 米拉約#9:11, 撒督#9:11, 米書蘭#撒督, 希勒家#9:11, {id: 亞薩利雅, note: "「管理神殿」"}]
    - ref: "9:12"
      new_root: true
      chain: [瑪基雅#9:12, 巴施戶珥, 耶羅罕#巴施戶珥, 亞大雅#耶羅罕]
    - ref: "9:12"
      new_root: true
      chain: [音麥, 米實利密, 米書蘭#米實利密, 雅希細拉, 亞第業, 瑪賽]
    - ref: "9:13"
      covers: true
      note: 他們和眾弟兄「共有一千七百六十人，是善於做神殿使用之工的」。
  notes:
    - text: 9:11 的大祭司家系（亞希突、米拉約、撒督、米書蘭、希勒家），和 6:11–13 的寫法不完全相同。
      refs: "6:11-13, 9:11"

- id: c9c
  chapter: 9
  title: 利未人和守門的
  range: "9:14-34"
  intro: 聖殿的工作分得很細：守門、管器皿、調香、烤餅、預備陳設餅、歌唱，各有專人。
  statements:
    - ref: "9:14"
      new_root: true
      chain: [哈沙比雅#9:14, 押利甘, 哈述, {id: 示瑪雅#哈述, note: 米拉利的子孫}]
    - ref: "9:15"
      roots: [拔巴甲, 黑勒施, 迦拉#9:15]
    - ref: "9:15"
      chain: [亞薩, 細基利#亞薩, 米迦#細基利, 瑪探雅]
    - ref: "9:16"
      new_root: true
      chain: [耶杜頓, 迦拉#耶杜頓, 示瑪雅#迦拉, 俄巴底]
    - ref: "9:16"
      new_root: true
      chain: [以利加拿#9:16, 亞撒#以利加拿, {id: 比利家#亞撒, note: "「住在尼陀法人的村莊」"}]
    - ref: "9:17, 9:19"
      chain: [可拉, 以比雅撒, 可利, {id: 沙龍, mark: main, note: 守門的「沙龍為長」}]
    - ref: "9:17"
      roots: [亞谷, 達們, 亞希幔]
      note: 9:17：「守門的是沙龍、亞谷、達們、亞希幔，和他們的弟兄」。
    - ref: "9:18-20"
      covers: true
      note: 他們「從前」看守「朝東的王門」；可拉人「都管理使用之工，並守會幕的門」；「從前以利亞撒的兒子非尼哈管理他們，耶和華也與他同在」。
    - ref: "9:21"
      chain: [米施利米雅, {id: 撒迦利雅#米施利米雅, note: "「看守會幕之門的」"}]
      new_root: true
    - ref: "9:22-27"
      covers: true
      note: 守門的「共有二百一十二名」，「是大衛和先見撒母耳所派」；東西南北「四方都有守門的」，村莊的弟兄「每七日來與他們換班」；守門的人「要每日早晨開門」。
    - ref: "9:28-30"
      covers: true
      note: 有人管理器皿，「按著數目拿出拿入」；有人管理「細麵、酒、油、乳香、香料」；「祭司中有人用香料做膏油」。
    - ref: "9:31"
      parent: 沙龍
      children: [{id: 瑪他提雅, note: "長子；「管理盤中烤的物」"}]
    - ref: "9:32-34"
      covers: true
      note: 哥轄子孫中有人「管理陳設餅的，每安息日預備擺列」；歌唱的利未族長「住在屬殿的房屋，晝夜供職，不做別樣的工」。
  notes:
    - text: 9:15 的瑪探雅是「亞薩的曾孫」，這裡接在 6:39 的亞薩名下；9:19 的沙龍是「可拉的曾孫、以比雅撒的孫子」，接在 6:37 的可拉、以比雅撒名下。
      refs: "9:15, 9:19, 6:37, 6:39"

