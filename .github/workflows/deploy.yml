name: Deploy Quartz to GitHub Pages

"on":
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "quartz/**"
      - "plugins/**"
      - "quartz.ts"
      - "quartz.config.yaml"
      - "quartz.lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Quartz build cache
        uses: actions/cache@v4
        with:
          path: .quartz-cache
          key: quartz-build-${{ hashFiles('quartz.config.yaml', 'plugins/**', 'quartz/**') }}
          restore-keys: |
            quartz-build-

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages base URL
        run: |
          sed -i 's|baseUrl: bible-wiki-zh-website.vercel.app|baseUrl: andyjr5566.github.io/Bible_wiki_zh_website|' quartz.config.yaml

      - name: Detect changed paths
        id: changes
        run: |
          # Check if any non-content file changed (quartz/**, plugins/**, config, etc.)
          CODE_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -vE '^content/' | wc -l | tr -d ' ')
          echo "code_changed=$CODE_CHANGED" >> $GITHUB_OUTPUT
          echo "Changed code files: $CODE_CHANGED"

      - name: Restore public/ output cache
        id: restore-public
        uses: actions/cache@v4
        with:
          path: public
          key: quartz-public-${{ github.sha }}
          restore-keys: |
            quartz-public-

      - name: Setup local plugins
        run: |
          mkdir -p .quartz/plugins
          rm -rf .quartz/plugins/wiki-tour .quartz/plugins/semantic-search .quartz/plugins/graph
          cp -r plugins/wiki-tour .quartz/plugins/wiki-tour
          cp -r plugins/semantic-search .quartz/plugins/semantic-search

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Apply patched plugins
        run: |
          mkdir -p .quartz/plugins/graph/dist
          cp -r plugins/graph/dist/* .quartz/plugins/graph/dist/

      - name: Build interactive websites
        run: |
          python quartz/static/website/build.py --ci-build > build_interactive.log 2>&1 || {
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add build_interactive.log
            git commit -m "chore: upload build log"
            git push origin HEAD
            exit 1
          }

      - name: Build Quartz
        env:
          # Enable incremental mode only when:
          # 1. public/ cache was restored (cache-hit), AND
          # 2. No quartz/plugins/config files changed (content-only push)
          QUARTZ_INCREMENTAL: ${{ steps.restore-public.outputs.cache-hit == 'true' && steps.changes.outputs.code_changed == '0' && '1' || '0' }}
        run: |
          echo "QUARTZ_INCREMENTAL=$QUARTZ_INCREMENTAL"
          npx quartz build --concurrency=2

      - name: Save public/ output cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: public
          key: quartz-public-${{ github.sha }}


      - name: Copy interactive website dist to public
        run: |
          find quartz/static/website -type d -name "dist" | while read dist_dir; do
            dest_dir="public/${dist_dir#quartz/}"
            mkdir -p "$(dirname "$dest_dir")"
            cp -r "$dist_dir" "$(dirname "$dest_dir")/"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
