# 歷代志上 10–29 章人物資料（唯一來源；頁面由 ../build_genealogy.py 產生）
#
# 寫法和 genealogy.yaml 相同（chain／parent＋children／roots／covers），另外：
#   roster:   按職分或次序排列的名單；成員欄位 id／as／ref／pos／desc／count／note
#             pos、desc、count、人名都必須逐字出現在成員經節
#   org:      組織圖節點 label／ref／check／children；check 的字串必須逐字出現在 ref
#   imports:  1–9 章族譜的人可以直接當父名；roster 成員用同一個 id 就會連到族譜頁
#   同名不同人用「名#識別」，識別字不顯示。

book: 歷代志上
scope: [10, 29]
output: appendix/歷代志上的大衛王朝人物圖.md
title: 歷代志上 10–29 章 大衛王朝人物圖
intro: |
  歷代志上從第 10 章起寫大衛作王。這一部分的名單多半按職分排列：誰是大衛的勇士、誰抬約櫃、誰在聖殿歌唱和守門、誰管府庫、每個月由哪一班輪值。下面按章把這些人整理成表，人名照和合本。在 1–9 章族譜出現過的人，旁邊標出族譜頁的經節。
footer: ''
parallels_label: 歷代志上
check_intro_quotes: true
chain_ref_span: true
imports:
  - {file: genealogy.yaml, page: appendix/歷代志上的完整人物支線圖.md}
howto:
  - 表格的「次序」欄照經文原句，例如「第一」「正月第一班」。
  - 「又見」連到本頁其他提到同一個人的地方；「族譜見」連到 1–9 章族譜頁。
  - 圖裡的**藍灰色框**是族譜頁已出現過的人，這一段的名字接在他底下。
  - '`23:6` 這樣的灰字是經節；沒寫書名的都是歷代志上。'
  - 人名一律照和合本；撒母耳記寫法不同的，見文末「平行經文對照」。
chapters:
  10: 掃羅之死
  11: 大衛作王和他的勇士
  12: 投奔大衛的人
  13: 從基列耶琳運約櫃
  14: 大衛在耶路撒冷
  15: 抬約櫃進大衛城
  16: 約櫃前事奉的人
  17: 拿單傳話
  18: 大衛的戰績和臣僕
  19: 亞捫人和亞蘭人
  20: 攻取拉巴和擊殺偉人
  21: 數點百姓
  22: 為建殿預備
  23: 利未人的班次
  24: 祭司二十四班
  25: 歌唱二十四班
  26: 守門的、管庫的和官長
  27: 軍隊和官員
  28: 大衛囑咐所羅門
  29: 奉獻和所羅門登基

