    text: 耶羅波安是尼八的兒子，原是所羅門的臣僕。先知亞希雅把新衣撕成十二片，叫他拿十片，表示他要得十個支派。王國分裂後他作以色列王，在伯特利和但各立一個金牛犢，對百姓說「這就是領你們出埃及地的神」。列王紀後來評論許多北國的王，常說他們「不離開尼八的兒子耶羅波安使以色列人陷在罪裡的一切罪」。他作王二十二年。
    refs: "王上 11:26-40, 王上 12:20-33, 王上 14:1-20, 王下 14:24"

