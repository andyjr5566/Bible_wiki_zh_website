    sections:
      - id: gen09-s1
        title: 活著的動物都可以吃
        verses: 3-6
        laws:
          - id: gen09-03
            title: 活著的動物都可以吃，只是肉帶著血不可吃
            refs: ["3-4"]
            topics: [clean-food, blood-fat]
            summary: 凡活著的動物都可以作你們的食物，如同菜蔬一樣；惟獨肉帶著血，那就是他的生命，你們不可吃。
            basis: [3, 4]
            why: [4]
          - id: gen09-05
            title: 流人血的，他的血也必被人所流
            refs: ["5-6"]
            topics: [homicide]
            summary: 流你們血、害你們命的，無論是獸是人，神必討他的罪；凡流人血的，他的血也必被人所流，因為神造人是照自己的形像造的。
            basis: [5, 6]
            why: [6]
