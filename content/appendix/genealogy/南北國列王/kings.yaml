    text: 希西家是亞哈斯的兒子，二十五歲登基，在耶路撒冷作王二十九年。他一登基就開了耶和華殿的門，潔淨聖殿，又守逾越節，也請以法蓮和瑪拿西的人來。亞述王西拿基立圍攻耶路撒冷，他和先知以賽亞禱告，耶和華差使者滅了亞述營中的人。他病重時禱告，神加添他十五年的壽數。歷代志又說他「心裡驕傲」，隨後他和耶路撒冷的居民「一同自卑」。
