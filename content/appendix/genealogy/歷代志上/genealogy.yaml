  notes:
    - text: 2:42「耶拉篾兄弟迦勒的長子米沙，是西弗之祖瑪利沙的兒子，是希伯崙之祖」句子結構不易斷開。這裡照字面列出米沙（西弗之祖）與瑪利沙（希伯崙之祖）兩人，不硬接他們之間的父子關係；2:43 的希伯崙另起一行。
      refs: "2:42-43"
    - text: 2:49「迦勒的女兒是押撒」。約書亞記 15:16–17 的迦勒（耶孚尼的兒子，見 4:15）也有一個女兒押撒，嫁給「迦勒兄弟基納斯的兒子俄陀聶」。
      refs: "2:49, 書 15:16-17"
    - text: 2:50 稱戶珥是「以法他的長子」，4:4 稱戶珥是「伯利恆之祖以法他的長子」；2:51 則稱戶珥的兒子薩瑪為「伯利恆之祖」。
      refs: "2:50-51, 4:4"

