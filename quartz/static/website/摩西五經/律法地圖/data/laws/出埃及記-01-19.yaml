        title: 安息日與嗎哪
        verses: 23-30
        laws:
          - id: ex16-23
            title: 第六天收雙倍的食物，第七天是聖安息日，不可出去收
            refs: ["23-30"]
            topics: [sabbath]
            summary: 明日是聖安息日，烤煮的預備好，所剩留到早晨；六日收取，第七日沒有嗎哪，不可出去收；第六日耶和華賜雙份食物。
            basis: [23, 25, 26, 27, 29]
            why: [29]
            entries: [安息日收取規定, 安息日]
