<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>場景實驗室（開發用）</title>
  <style>
    html, body { margin: 0; height: 100%; background: #15130f; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #lab-bar { position: fixed; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
      padding: 6px 10px; background: rgba(255,255,255,.92); border: 2px solid #111; z-index: 5; }
    #lab-bar label { display: inline-flex; gap: 4px; align-items: center; }
    #lab-bar input[type=range] { width: 150px; }
    #lab-log { position: fixed; right: 8px; top: 8px; margin: 0; padding: 6px 8px; max-width: 280px; max-height: 40vh; overflow: hidden;
      background: rgba(0,0,0,.6); color: #fff; font: 11px/1.4 ui-monospace, monospace; z-index: 5; pointer-events: none; white-space: pre-wrap; }
    /* meal 分格：與真正網站的 DOM 框同一組數字 */
    #lab-panel { position: fixed; left: 6vw; top: 14vh; width: 44vw; height: 62vh; border: 3px solid #161412; box-sizing: border-box; display: none; z-index: 2; pointer-events: none; }
    @media (max-width: 720px) { #lab-panel { left: 4vw; right: 4vw; width: auto; top: 108px; height: clamp(200px, 34vh, 290px); } }
    /* ?boxes=1：假的說明框，用來檢查構圖有沒有被蓋住（桌機在右；手機貼底，蓋住 y>0.55h；上方有標題列與月份導覽） */
    #lab-box { position: fixed; display: none; z-index: 3; pointer-events: none; background: rgba(255,255,255,.55); border: 2px dashed #a00; box-sizing: border-box; }
    #lab-box.on { display: block; left: 56vw; top: 15vh; width: 35vw; height: 50vh; }
    #lab-box.on.left { left: 6vw; }
    #lab-top { position: fixed; display: none; z-index: 3; pointer-events: none; background: rgba(255,255,255,.55); border: 2px dashed #a00; box-sizing: border-box; left: 0; right: 0; top: 0; height: 13vh; }
    @media (max-width: 720px) { #lab-box.on { left: 8px; right: 8px; width: auto; top: 55vh; height: 44vh; } #lab-top.on { display: block; } }    body.lab-hide #lab-bar, body.lab-hide #lab-log { display: none; }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div id="lab-panel" data-jf-panel="meal"></div>
  <div id="lab-box"></div>
  <div id="lab-top"></div>
  <div id="lab-bar">
    <label>章 <select id="lab-chapter"></select></label>
    <label>cue <select id="lab-cue"></select></label>
    <label>beatProgress <input id="lab-p" type="range" min="0" max="1" step="0.005" value="0.5" /><output id="lab-pv"></output></label>
    <label>day <input id="lab-day" type="range" min="1" max="30" step="0.05" value="14" /><output id="lab-dv"></output></label>
    <label>count <input id="lab-count" type="range" min="0" max="50" step="0.5" value="0" /><output id="lab-cv"></output></label>
    <label>bake <input id="lab-bake" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label>blow <input id="lab-blow" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label><input id="lab-dark" type="checkbox" /> 暗色</label>
    <label><input id="lab-motion" type="checkbox" /> 關閉動態</label>
    <button data-act="dip">蘸血</button>
    <button data-act="lintel">門楣</button>
    <button data-act="left">左門柱</button>
    <button data-act="right">右門柱</button>
    <button id="lab-reset">重設塗血</button>
    <button id="lab-wave">搖一搖</button>
    <button id="lab-wave-reset">重設搖禾捆</button>
  </div>
  <pre id="lab-log"></pre>
  <script type="module" src="/src/scene/lab.ts"></script>
</body>
</html>
