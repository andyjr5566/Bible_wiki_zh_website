name: Deploy Quartz to GitHub Pages

"on":
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "quartz/**"
      - "plugins/**"
      - "quartz.ts"
      - "quartz.config.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Quartz build cache
        uses: actions/cache@v4
        with:
          path: |
            .quartz-cache
            .quartz
          key: quartz-build-${{ hashFiles('quartz.config.yaml', 'plugins/**', 'quartz/**') }}
          restore-keys: |
            quartz-build-

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages base URL
        run: |
          sed -i 's|baseUrl: bible-wiki-zh-website.vercel.app|baseUrl: andyjr5566.github.io/Bible_wiki_zh_website|' quartz.config.yaml

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Build Quartz
        run: npx quartz build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
