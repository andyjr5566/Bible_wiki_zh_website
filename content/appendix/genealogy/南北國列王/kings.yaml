  kings_refs: "王下 14:21-22, 王下 15:1-7"
  chronicles_refs: "代下 26:1-23"
  prose:
    text: 烏西雅（列王紀多作亞撒利雅）十六歲登基，在耶路撒冷作王五十二年。他打敗非利士人和亞拉伯人，在耶路撒冷建造城樓，在曠野挖了許多井；他在山地和佳美之地有農夫和修理葡萄園的人，「因為他喜悅農事」。強盛以後，他進耶和華的殿要燒香，祭司亞撒利雅攔阻他，他發怒，額上就發出大痲瘋，從此住在別的宮裡，直到死日。以賽亞在「烏西雅王崩的那年」看見主坐在高高的寶座上。
    refs: "代下 26:1-23, 王下 15:1-7, 賽 6:1"

