# 歷代志下人物資料（唯一來源；頁面由 ../build_genealogy.py 產生）
#
# 寫法同 歷代志上/大衛王朝.yaml（族譜 statements、roster、covers），另外：
#   groups:   這一頁按王分組；段落用 group 指到分組，不用 chapter
#   card:     段落開頭的王卡片；king 指到 ../南北國列王/kings.yaml 的 id，fields 每格要逐字在 ref
#   同名不同人用「名#識別」，識別字不顯示。

book: 歷代志下
scope: [1, 36]
output: appendix/歷代志下的列王人物圖.md
title: 歷代志下 猶大列王人物圖
intro: |
  歷代志下從所羅門寫到猶大亡國，幾乎只寫猶大的王；北國以色列的王只在和猶大有往來的地方出現。下面每位王一張卡片，列出經文寫的父親、母親、登基年歲、在位年數、評語和葬在哪裡，再列出這位王在位時出現的人。人名照和合本。
footer: ''
parallels_label: 歷代志下
check_intro_quotes: true
chain_ref_span: true
kings_registry: ../南北國列王/kings.yaml
howto:
  - 卡片的記號：● 行正、●但 行正另有但書、◐ 好轉壞、◑ 壞轉好、○ 行惡、— 沒有評語；※ 表示歷代志和列王紀的寫法不同。分類照經文評語的原句，詳見南北國列王對照。
  - 卡片的年代照 Thiele 年表，數字前面加「約」；經文本身沒有公元年份。
  - '`12:13` 這樣的灰字是經節；沒寫書名的都是歷代志下。'
  - 人名一律照和合本；列王紀寫法不同的，見文末「平行經文對照」。
