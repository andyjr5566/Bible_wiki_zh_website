    text: 亞哈斯是約坦的兒子，二十歲登基。他為巴力鑄造偶像，「使他的兒子經火」。亞蘭王利汛和以色列王比加攻打猶大時，以賽亞勸他「你要謹慎安靜」，不要害怕，他卻向亞述王求助。他照大馬色祭壇的樣式在耶路撒冷造壇，又封鎖耶和華殿的門。死後「沒有送入以色列諸王的墳墓中」。
