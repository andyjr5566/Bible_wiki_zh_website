  kings_refs: "王下 13:10-25, 王下 14:8-16"
  chronicles_refs: "代下 25:17-25"
  prose:
    text: 約阿施是約哈斯的兒子，作王十六年。以利沙病危時，約阿施去哭著見他；以利沙叫他拿箭擊地，他只擊了三次，以利沙說他只能打敗亞蘭人三次。猶大王亞瑪謝向他挑戰，他在伯示麥打敗猶大，拆毀耶路撒冷的城牆，帶走殿裡和王宮的金銀。
    refs: "王下 13:10-25, 王下 14:8-16, 代下 25:17-24"

