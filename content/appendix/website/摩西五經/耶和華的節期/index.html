<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>耶和華的節期</title>
  <meta name="description" content="順著一年，從正月走過摩西五經裡神定下的節期。經文、註釋的原句和希伯來原文，都可以點開來看。" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#efeadf" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23efeadf'/%3E%3Crect x='4' y='6' width='24' height='5' fill='%23a3231b'/%3E%3Crect x='6' y='11' width='5' height='17' fill='%23a3231b'/%3E%3Crect x='21' y='11' width='5' height='17' fill='%23a3231b'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' fill='none' stroke='%23161412' stroke-width='3'/%3E%3C/svg%3E" />
  <script>
    document.documentElement.classList.add('jf-js');
    /* 動態開關：預設有動態，不跟作業系統的「減少動態」；讀者的選擇存在 localStorage（jf-motion） */
    (function () {
      var v = null;
      try { v = window.localStorage.getItem('jf-motion'); } catch (e) {}
      document.documentElement.setAttribute('data-motion', v === 'off' ? 'off' : 'on');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Serif+Hebrew:wght@500&display=swap"
  />
  <style>
    /* 載入畫面與 noscript 需要在主樣式載入前就能看，所以放在這裡 */
    :root { color-scheme: light dark; --jf-paper: #efeadf; --jf-ink: #161412; }
    @media (prefers-color-scheme: dark) { :root { --jf-paper: #15130f; --jf-ink: #ece4d2; } }
    html, body { margin: 0; background: var(--jf-paper); color: var(--jf-ink); }
    .jf-loading { display: none; }
    .jf-js .jf-loading {
      position: fixed; inset: 0; z-index: 200; display: grid; place-content: center; gap: 14px; text-align: center;
      background: var(--jf-paper); color: var(--jf-ink); transition: opacity .6s cubic-bezier(.455, .03, .515, .955);
    }
    .jf-js .jf-loading.is-gone { opacity: 0; pointer-events: none; }
    .jf-loading-title { margin: 0; font: 400 clamp(44px, 11vw, 120px) / 1.1 'Cactus Classical Serif', 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif; }
    .jf-loading-note { margin: 0; font: 500 15px / 1.6 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; letter-spacing: .3em; opacity: .7; }
    .jf-noscript { max-width: 32rem; margin: 18vh auto 0; padding: 0 20px; font: 500 17px / 1.8 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    .jf-noscript h1 { font: 400 clamp(44px, 10vw, 96px) / 1.15 'Cactus Classical Serif', 'Noto Serif TC', 'Songti TC', serif; margin: 0 0 16px; }
  </style>
</head>
<body>
  <!-- 說明框邊線的手繪抖動：只套在說明框的框線圖層上，文字不受影響 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="jf-rough" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="jf-loading" class="jf-loading" role="status" aria-live="polite">
    <p class="jf-loading-title">耶和華的節期</p>
    <p class="jf-loading-note">載入中</p>
  </div>

  <canvas id="jf-canvas" class="jf-canvas" aria-hidden="true"></canvas>
  <div id="jf-fallback" class="jf-fallback" aria-hidden="true" hidden></div>
  <div id="jf-app"></div>

  <noscript>
    <div class="jf-noscript">
      <h1>耶和華的節期</h1>
      <p>這個網站需要開啟 JavaScript 才能顯示。請在瀏覽器設定裡允許後，重新整理頁面。</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
