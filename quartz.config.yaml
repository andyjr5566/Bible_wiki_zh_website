# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 聖經研讀知識庫
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: zh-TW
  baseUrl: andyjr5566.github.io/Bible_wiki_zh_website
  ignorePatterns:
    - private
    - templates
    - .obsidian
    # quartz/static/website is the CI build workspace for the interactive apps (sources,
    # tests, data). Only each app's built dist/ is published, by deploy.yml.
    - website/**

#  更換字型：
# header: Noto Serif TC (控制所有大標題的字體，目前是思源宋體)
# body: LXGW WenKai TC (控制內文字體，目前是霞鶖文楷)
# 更換主色調：
# light: 是背景色
# dark: 是主要內文文字顏色
# secondary: 是標題與連結的顏色 (目前是經典紅 #7A1C1C)

  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Noto Sans TC
      body: LXGW WenKai TC
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#FAF7F0"
        lightgray: "#EFECE4"
        gray: "#A8A29E"
        darkgray: "#44403C"
        dark: "#1C1917"
        secondary: "#7A1C1C"
        tertiary: "#B45309"
        highlight: rgba(122, 28, 28, 0.08)
        textHighlight: "#FEF08A88"
      darkMode:
        light: "#1C1917"
        lightgray: "#292524"
        gray: "#78716C"
        darkgray: "#D6D3D1"
        dark: "#F5F5F4"
        secondary: "#DC2626"
        tertiary: "#D97706"
        highlight: rgba(217, 119, 6, 0.15)
        textHighlight: "#B3AA0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: false
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      prettyLinks: false
      disableBrokenWikilinks: true
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:andyjr5566/folder-page
    enabled: true
    options:
      showFolderCount: true
      showSubfolders: false
      prefixFolders: false
      sortBy: chapter
  - source: github:quartz-community/tag-page
    enabled: true
  - source: ./plugins/explorer
    enabled: true
    options:
      title: 探索
      folderClickBehavior: link
      folderDefaultState: open
      useSavedState: false
      # 顯示名稱改成中文，全部保留（U-7）。外掛會把這段字串原樣交給瀏覽器執行（new Function），
      # 所以 YAML 可以直接寫函式。同步腳本（sync_content.ps1）也會為這幾個項目加上 frontmatter title，
      # 兩邊並存：沒有 title 時由這裡補上，不需要改 content/。
      mapFn: |
        (node) => {
          const names = {
            appendix: "附錄",
            link_folder: "知識節點",
            install_computer: "Obsidian 電腦版安裝說明",
            install_mobile: "Obsidian 手機版安裝說明",
            readme: "本站簡介",
          };
          // 檔案的 slug 會被轉成小寫（README -> readme），所以比對時一律用小寫
          const key = String(node.slugSegment || "").toLowerCase();
          const depth = (node.slugSegments || [node.slugSegment]).length;
          if (depth === 1 && Object.prototype.hasOwnProperty.call(names, key)) {
            node.displayName = names[key];
          }
        }
    layout:
      position: left
      priority: 50
  # Graph component with Chinese slug decoding and expand modal view locked to depth 1
  - source: github:quartz-community/graph
    enabled: true
    options:
      enableGlobal: true
      localGraph:
        depth: 1
      globalGraph:
        depth: 1
    layout:
      position: right
      priority: 10
  - source: ./plugins/wiki-tour
    enabled: true
    layout:
      position: beforeBody
      priority: 5
  # 章節頁的經文朗讀（瀏覽器內建語音，只朗讀經文）。設計見 dev-notes/read-aloud/。
  - source: ./plugins/read-aloud
    enabled: true
    layout:
      position: beforeBody
      priority: 6
  # 個人研經筆記（Google 登入＋使用者自己的 Google Drive 同步）。設計見 dev-notes/personal-notes/。
  # enabled: false 可整個關閉；syncEnabled: false 讓所有人改為本機模式（緊急開關）。
  - source: ./plugins/personal-notes
    enabled: true
    options:
      clientId: 339980089528-va9622cqhnurr1sqrl8kl6aa5bim30fl.apps.googleusercontent.com
      syncEnabled: true
      minPollSeconds: 180
      maxWritesPerMinute: 6
      # 公告（顯示在登入說明視窗與「我的筆記」頁）；空白＝不顯示
      notice: ""
    layout:
      position: afterBody
      priority: 20
  - source: ./plugins/semantic-search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # 閱讀模式按鈕已由個人筆記外掛的「我的筆記」入口取代（2026-10-18 使用者決定）
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      rootName: 首頁
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        讀者意見回饋: https://docs.google.com/forms/d/e/1FAIpQLSflHkD1jUCct87qDcPrI07PrAgzIWmxqbC4RiPQIuWyNbo5AQ/viewform
        隱私權政策: https://andyjr5566.github.io/Bible_wiki_zh_website/教學/隱私權政策
        快速入門: https://andyjr5566.github.io/Bible_wiki_zh_website/教學/快速入門
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
      # 預設收合「屬性」區塊（欄位名中文化與隱藏空列見 quartz/styles/custom.scss、notePropertiesZh.inline.ts）
      collapsed: true
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: true
    options:
      theme: default
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
    canvas: {}
    bases: {}
    my-notes:
      positions:
        right: []
