      mother: 猶大女子
      children: [{id: 雅列#米列, of: 基多}, {id: 希伯#米列, of: 梭哥}, {id: 耶古鐵, of: 撒挪亞}]
    - ref: "4:19"
      parent: 荷第雅
      new_parent: true
      mother: 拿含的妹子
      children: [{id: 基伊拉, note: 迦米人}, {id: 以實提摩之祖, note: 瑪迦人}]
    - ref: "4:20"
