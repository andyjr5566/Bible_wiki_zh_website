  - chapter: 31
    excluded:
      - { verses: "1-9", reason: 摩西交棒給約書亞和將律法書交給祭司的敘事 }
      - { verses: "14-25", reason: 會幕裡的最後一次顯現與神給摩西的歌 }
      - { verses: "27-30", reason: 摩西預告百姓悖逆、召聚眾人聽歌的話 }
    sections:
      - id: deut31-s1
        title: 念律法與律法書的存放
        verses: 10-13
        laws:
          - id: deut31-10
            title: 每逢七年末一年的住棚節，將律法念給眾人聽
            refs: ["10-13"]
            topics: [sabbath-year, booths, levites]
            summary: 每逢七年的末一年，就在豁免年的定期住棚節的時候，以色列眾人來到耶和華所選擇的地方朝見他，要將這律法念給他們聽；招聚男女、孩子和寄居的，使他們聽、學習，好敬畏耶和華，謹守遵行。
            basis: [10, 11, 12]
            why: [12]
      - id: deut31-s2
        title: 律法書放在約櫃旁
        verses: 26
        laws:
          - id: deut31-26
            title: 將律法書放在約櫃旁作見證
            refs: ["26"]
            topics: [altar-tabernacle]
            summary: 將這律法書放在耶和華你們神的約櫃旁，可以在那裡見證以色列人的不是。
            basis: [26]
            why: [26]
  - chapter: 32
    excluded:
      - { verses: "1-52", reason: 摩西的歌與神吩咐摩西上尼波山的敘事 }
    sections: []
