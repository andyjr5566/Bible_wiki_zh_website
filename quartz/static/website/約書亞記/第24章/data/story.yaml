        summary: 在約但河東，神把亞摩利人交在百姓手中。摩押王巴勒請巴蘭來咒詛他們。神不肯聽巴蘭的話，巴蘭倒為他們連連祝福。
        placeLinks:
          - heshbon
          - bashan
          - moab
        externalLinks:
          - kind: wilderness
            label: 在『曠野四十二站』看這段路（另開網頁）
        commentaryPreview: 巴勒有沒有出兵？咒詛怎樣變成祝福？
        commentaries:
          - id: east-tyndale-balak
            source: GT
            work: GT《丁道爾聖經注釋》
            verse: 書24:9
            paraphrase: 對照士11:25耶弗他否認巴勒曾攻擊以色列人，認為那或許是反諷說法，指巴勒雇用巴蘭來咒詛就等於耗盡了他作戰的力量。
            line: 136
            evidence: 或許這是一種反諷的說法，講到巴勒雇用巴蘭來咒詛
          - id: east-gt-study-bless
            source: GT
            work: GT《約書亞記研經資料(蔡哲民等)》
            verse: 書24:10
            paraphrase: 說明在巴蘭這件事上，神勝過了先知和他咒詛的力量，把咒詛變成神子民的祝福，所以可以算是救他們脫離巴勒的手。
            line: 145
            evidence: 神克服了先知和他咒詛的力量，把它變為祂子民的祝福
        wordPreview: 『我不肯聽』與河東的『交在』
        words:
          - id: word-v8-delivered
            verse: 8
            position: 11
            label: 我將…交在
            note: 第 14 個『我』的動詞。和第 3 節的『賜給』是同一個字，這是本章第 4 次出現。講到打仗，和合本譯作交在。
          - id: word-v10-unwilling
            verse: 10
            position: 2
            label: 我不肯
            note: 第 16 個『我』的動詞。字典的意思是願意，前面有否定的字，就是不肯。CT 列的字義是樂意、同意。
