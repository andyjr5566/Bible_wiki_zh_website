oakMoments:
  - era: 0
    title: 亞伯蘭在摩利橡樹那裡築壇
    ref: 創12:6-7
    summary: 亞伯蘭進迦南地，到了示劍地方、摩利橡樹那裡；耶和華向他顯現應許賜地給他後裔，他在那裡築了一座壇。
