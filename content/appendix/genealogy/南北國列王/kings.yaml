      - {book: 王下, role: 評語, quote: 約哈斯行耶和華眼中看為惡的事, ref: "王下 13:2"}
  synchronism:
    - {quote: 猶大王亞哈謝的兒子約阿施二十三年，耶戶的兒子約哈斯在撒瑪利亞登基作以色列王, ref: "王下 13:1"}
  kings_refs: "王下 13:1-9"
  prose:
    text: 約哈斯是耶戶的兒子，作王十七年。亞蘭王哈薛和他兒子便哈達一直欺壓以色列，「約哈斯懇求耶和華，耶和華就應允他」，賜給以色列人一位拯救者。但百姓仍不離開耶羅波安家的罪，約哈斯的軍隊只剩下五十馬兵、十輛戰車、一萬步兵。
    refs: "王下 13:1-9"

