cards:
  - id: 比拿雅#耶何耶大之子
    text: 他「下坑裡去殺了一個獅子」，又用棍子從埃及人手裡奪槍。所羅門作王以後，「立耶何耶大的兒子比拿雅作元帥，代替約押」。
    refs: "11:22-23, 王上 2:35"
  - id: 烏利亞#赫人
    text: 拔示巴的丈夫，經文稱拔示巴是「赫人烏利亞的妻」。後來在約押攻城時，「赫人烏利亞也死了」。
    refs: "11:41, 撒下 11:3, 撒下 11:17"
  - id: 烏撒#約櫃
    text: 運約櫃時「烏撒就伸手扶住約櫃」，耶和華向他發怒，「他就死在神面前」。
    refs: "13:9-10"
  - id: 米甲
    text: 掃羅的女兒。約櫃進大衛城時，他看見大衛跳舞，「心裡就輕視他」。撒母耳記下說他「直到死日，沒有生養兒女」。
    refs: "15:29, 撒下 6:23"
  - id: 阿珥楠
    text: 耶布斯人。瘟疫停在他的禾場，大衛向他買地築壇，「為那塊地平了六百舍客勒金子給阿珥楠」。撒母耳記下作「耶布斯人亞勞拿」。
    refs: "21:15, 21:25, 撒下 24:18"
  - id: 亞希多弗
    text: 大衛的謀士。押沙龍造反時，「亞希多弗也在叛黨之中，隨從押沙龍」；後來他的計謀沒被採用，就「吊死了」。
    refs: "27:33, 撒下 15:31, 撒下 17:23"
  - id: 戶篩#亞基人
    text: 經文稱他「作王的陪伴」，撒母耳記下稱他「大衛的朋友戶篩」。押沙龍的人說：「亞基人戶篩的計謀比亞希多弗的計謀更好」。
    refs: "27:33, 撒下 15:37, 撒下 17:14"
