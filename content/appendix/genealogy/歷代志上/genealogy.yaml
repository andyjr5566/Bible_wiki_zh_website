  intro: 西緬的家族不大（4:27），住在猶大地的南方。這一段後半記了兩次向外擴張：往基多口找草場，和上西珥山。
  statements:
    - ref: "4:24"
      parent: 西緬
      children: [尼母利, 雅憫#西緬, 雅立, 謝拉#西緬, 掃羅#西緬]
    - ref: "4:25-26"
      chain: [掃羅#西緬, 沙龍#掃羅, 米比衫#西緬, 米施瑪#西緬, 哈母利, 撒刻, 示每#撒刻]
    - ref: "4:27"
      covers: true
      note: 「示每有十六個兒子，六個女兒，他弟兄的兒女不多，他們各家不如猶大族的人丁增多」。
    - ref: "4:28-31"
      label: 西緬人住的城邑
      places: [別是巴, 摩拉大, 哈薩書亞, 辟拉, 以森, 陀臘, 彼土利, 何珥瑪, 洗革拉, 伯瑪嘉博, 哈薩蘇撒, 伯比利, 沙拉音]
      note: 「這些城邑直到大衛作王的時候都是屬西緬人的」。
    - ref: "4:32-33"
      label: 另外五個城邑
      places: [以坦, 亞因, 臨門, 陀健, 亞珊]
      note: 「還有屬城的鄉村，直到巴力」。
    - ref: "4:34"
      roots: [米所巴, 雅米勒]
    - ref: "4:34"
      parent: 亞瑪謝#約沙之父
      parent_as: 亞瑪謝
      new_parent: true
      children: [約沙]
    - ref: "4:35"
      roots: [約珥#西緬]
    - ref: "4:35"
      new_root: true
      chain: [亞薛, 西萊雅#亞薛, 約示比, 耶戶#約示比]
    - ref: "4:36"
      roots: [以利約乃#西緬, 雅哥巴, 約朔海, 亞帥雅#西緬, 亞底業, 耶西篾, 比拿雅#西緬]
    - ref: "4:37"
      new_root: true
      chain: [示瑪雅#申利之父, 申利, 耶大雅#申利, 亞龍, 示非#亞龍, 細撒]
    - ref: "4:38"
      covers: true
      note: 4:34–37 這些人，「都是作族長的，他們宗族的人數增多」。
    - ref: "4:39-41"
      covers: true
      note: 他們往「基多口」去找牧羊的草場，在「猶大王希西家年間」攻擊那裡的「含族人」和「米烏尼人」，「就住在他們的地方，直到今日」。
    - ref: "4:42-43"
      parent: 以示#4:42
      parent_as: 以示
      new_parent: true
      children: [毘拉提#以示, 尼利雅#以示, 利法雅#以示, 烏薛#以示]
      note: 西緬人中「有五百人上西珥山」，由以示的四個兒子率領，「殺了逃脫剩下的亞瑪力人，就住在那裡直到今日」。

# ───────────────────────── 第 5 章 ─────────────────────────
- id: c5a
  chapter: 5
  title: 流便
  range: "5:1-10"
  intro: 流便是長子，經文先解釋為什麼族譜不從他開始，再列出他的兒子和後代。
  statements:
    - ref: "5:1-2"
      covers: true
      note: 流便「因他污穢了父親的床，他長子的名分就歸了約瑟」；「猶大勝過一切弟兄，君王也是從他而出；長子的名分卻歸約瑟」。
    - ref: "5:3"
      parent: 流便
      children: [哈諾#流便, 法路, 希斯倫, 迦米#流便]
    - ref: "5:4-6"
      new_root: true
      chain: [約珥#流便, 示瑪雅#約珥, 歌革, 示每#歌革, 米迦#示每, 利亞雅#米迦, 巴力#利亞雅, {id: 備拉, note: "流便支派的首領，「被亞述王提革拉毘尼色擄去」"}]
    - ref: "5:7"
      roots: [{id: 耶利#流便, note: 為首}, 撒迦利雅#流便]
      note: 5:7：耶利、撒迦利雅和下面的比拉，是備拉的弟兄，「照著宗族，按著家譜作族長」。
    - ref: "5:8"
      new_root: true
      chain: [約珥#比拉, 示瑪#約珥, 亞撒#示瑪, 比拉#亞撒]
    - ref: "5:8-9"
      label: 約珥一家住的地方
      places: [亞羅珥, 尼波, 巴力免, 伯拉河]
      note: 「因為他們在基列地牲畜增多」。
    - ref: "5:10"
      covers: true
      note: 「掃羅年間，他們與夏甲人爭戰」，佔了基列東邊的全地。
  notes:
    - text: 5:4 的約珥沒有交代是流便哪一個兒子的後代。5:6 被擄的是「備拉」，和 5:8 的「比拉」是兩個人。
      refs: "5:4-8"

- id: c5b
  chapter: 5
  title: 迦得
  range: "5:11-17"
  intro: 迦得的子孫住在巴珊和基列。這一段沒有從迦得本人往下排，而是列出幾位族長，再往上追溯其中一家的祖先。
  statements:
    - ref: "5:11"
      covers: true
      note: 迦得的子孫「在流便對面，住在巴珊地，延到撒迦」。
    - ref: "5:12"
      roots: [{id: 約珥#迦得, note: 族長}, {id: 沙番, note: 副族長}, 雅乃, {id: 沙法#迦得, note: 住在巴珊}]
    - ref: "5:14"
      new_root: true
      chain: [布斯, 耶哈多, 耶示篩, 米迦勒#耶示篩, 基列#米迦勒, 耶羅亞, 戶利, 亞比孩]
    - ref: "5:13-14"
      parent: 亞比孩
      children: [米迦勒#亞比孩, 米書蘭#亞比孩, 示巴#亞比孩, 約賴, 雅干, 細亞, 希伯#亞比孩]
    - ref: "5:15"
      new_root: true
      chain: [古尼#迦得, 押比疊, {id: 亞希#押比疊, note: 族長}]
    - ref: "5:16-17"
      covers: true
      note: 他們住在「基列與巴珊和巴珊的鄉村，並沙崙的郊野」，「在猶大王約坦並在以色列王耶羅波安年間，都載入家譜」。

- id: c5c
  chapter: 5
  title: 河東兩個半支派的戰役
  range: "5:18-22"
  intro: 流便、迦得和瑪拿西半支派聯手作戰。經文把勝利的原因說得很清楚。
  statements:
    - ref: "5:18-19"
      label: 對手
      places: [夏甲人, 伊突人, 拿非施人, 挪答人]
      note: 河東聯軍「共有四萬四千七百六十名」。
    - ref: "5:20"
      covers: true
      note: 「因為他們在陣上呼求神，倚賴神，神就應允他們」。
    - ref: "5:21-22"
      covers: true
      note: 他們擄掠了大批牲畜和人口（數目見文末〈經文記下的人數〉），「因為這爭戰是出乎神」，就住在敵人的地上，「直到被擄的時候」。

- id: c5d
  chapter: 5
  title: 河東的瑪拿西半支派，以及被擄
  range: "5:23-26"
  intro: 瑪拿西半支派的七個族長，接著是河東各支派被擄的原因和經過。
  statements:
    - ref: "5:23"
      covers: true
      note: 瑪拿西半支派的人住的地方「從巴珊延到巴力黑們、示尼珥與黑門山」。
    - ref: "5:24"
      roots: [以弗#5:24, 以示#5:24, 以列#5:24, 亞斯列#5:24, 耶利米, 何達威雅#5:24, 雅疊]
      note: 5:24：這七人「都是大能的勇士，是有名的人，也是作族長的」。
    - ref: "5:25-26"
      covers: true
      note: 他們「得罪了他們列祖的神」，所以神「激動亞述王普勒和亞述王提革拉毘尼色的心」，把流便人、迦得人、瑪拿西半支派的人擄到哈臘、哈博、哈拉與歌散河邊，「直到今日還在那裡」。

# ───────────────────────── 第 6 章 ─────────────────────────
- id: c6a
  chapter: 6
  title: 大祭司的家系
  range: "6:1-15"
  intro: 利未支派一開頭就沿著亞倫的兒子以利亞撒，一代代排到被擄時的約薩答。這是一條父傳子的祭司家系。
  spine: [利未, 約薩答]
  statements:
    - ref: "6:1"
      parent: 利未
      children: [革順, {id: 哥轄, mark: main}, 米拉利]
    - ref: "6:2"
      parent: 哥轄
      children: [{id: 暗蘭, mark: main}, 以斯哈, 希伯倫, 烏薛#哥轄]
    - ref: "6:3"
      parent: 暗蘭
      children: [{id: 亞倫, mark: main}, 摩西]
    - ref: "6:3"
      parent: 暗蘭
      rel: 女
      children: [米利暗]
    - ref: "6:3"
      parent: 亞倫
      children: [拿答#亞倫, 亞比戶, {id: 以利亞撒, mark: main}, 以他瑪]
    - ref: "6:4-15"
      chain: [以利亞撒, {id: 非尼哈, mark: main}, {id: 亞比書, mark: main}, {id: 布基, mark: main}, {id: 烏西, mark: main}, {id: 西拉希雅, mark: main}, {id: 米拉約, mark: main}, {id: 亞瑪利雅, mark: main}, {id: 亞希突, mark: main}, {id: 撒督, mark: main}, {id: 亞希瑪斯, mark: main}, {id: 亞撒利雅#亞希瑪斯, mark: main}, {id: 約哈難#亞撒利雅, mark: main}, {id: 亞撒利雅#約哈難, mark: main, note: "「在所羅門於耶路撒冷所建造的殿中，供祭司的職分」"}, {id: 亞瑪利雅#亞撒利雅, mark: main}, {id: 亞希突#亞瑪利雅, mark: main}, {id: 撒督#亞希突, mark: main}, {id: 沙龍#撒督, mark: main}, {id: 希勒家, mark: main}, {id: 亞撒利雅#希勒家, mark: main}, {id: 西萊雅, mark: main}, {id: 約薩答, mark: main, note: "耶路撒冷被擄時，「這約薩答也被擄去」"}]
  notes:
    - text: 這條家系裡亞瑪利雅、亞希突、撒督、亞撒利雅都出現不只一次，是同名的不同世代。
      refs: "6:7-14"

- id: c6b
  chapter: 6
  title: 利未三族的其他家系
  range: "6:16-30"
  intro: 回到利未的三個兒子，分別往下排革順、哥轄、米拉利三族，最後一族接到先知撒母耳。
  statements:
    - ref: "6:16"
      parent: 利未
      children: [革順, 哥轄, 米拉利]
    - ref: "6:17"
      parent: 革順
      children: [立尼, 示每#革順]
    - ref: "6:18"
      parent: 哥轄
      children: [暗蘭, 以斯哈, 希伯倫, 烏薛#哥轄]
    - ref: "6:19"
      parent: 米拉利
      children: [抹利, 母示]
      note: 6:19：「這是按著利未人宗族分的各家」。
    - ref: "6:20-21"
      chain: [革順, 立尼, 雅哈#立尼, 薪瑪#立尼, 約亞, 易多, 謝拉#易多, 耶特賴]
    - ref: "6:22-24"
      chain: [哥轄, 亞米拿達#哥轄, 可拉#亞米拿達, 亞惜#可拉, 以利加拿#亞惜, 以比雅撒#以利加拿, 亞惜#以比雅撒, 他哈#亞惜, 烏列, 烏西雅, 少羅]
    - ref: "6:25"
      parent: 以利加拿#6:25
      parent_as: 以利加拿
      new_parent: true
      children: [亞瑪賽#6:25, 亞希摩]
    - ref: "6:26-27"
      chain: [亞希摩, 以利加拿#亞希摩, 瑣菲, 拿哈#瑣菲, 以利押#拿哈, 耶羅罕#以利押, 以利加拿#耶羅罕, {id: 撒母耳, mark: main}]
    - ref: "6:28"
      parent: 撒母耳
      children: [{id: 約珥#撒母耳, note: 長子}, {id: 亞比亞, note: 次子}]
    - ref: "6:29-30"
      chain: [米拉利, 抹利, 立尼#抹利, 示每#立尼, 烏撒#示每, 示米亞#烏撒, 哈基雅, 亞帥雅#哈基雅]
  notes:
    - text: 6:25 的以利加拿，經文沒有說是 6:23 的哪一位以利加拿，這裡另起一行。
      refs: "6:23-25"
    - text: 撒母耳的祖先在本章出現兩次，名字不全相同：6:26–27 是瑣菲、拿哈、以利押，6:34–35 是蘇弗、陀亞、以列。可拉的父親，6:22 寫亞米拿達，6:38 寫以斯哈。兩份名單照各自原文分開列。
      refs: "6:22, 6:26-27, 6:34-35, 6:38"
    - text: 撒母耳記上 1:1 說撒母耳的父親以利加拿是「以法蓮人」；本章把這一家列在利未支派哥轄族。
      refs: "6:27, 撒上 1:1"

- id: c6c
  chapter: 6
  title: 大衛派定的三位歌唱領袖
  range: "6:31-48"
  intro: 約櫃安設以後，大衛派利未人在會幕前歌唱。三族各出一位領袖，經文把每位的祖先一路追回利未：希幔（哥轄族）站中間，亞薩（革順族）在右邊，以探（米拉利族）在左邊。
  statements:
    - ref: "6:31-32"
      covers: true
      note: 「約櫃安設之後，大衛派人在耶和華殿中管理歌唱的事」；所羅門建殿以後，「他們便按著班次供職」。
    - ref: "6:33-38"
      chain: [哥轄, 以斯哈, 可拉, 以比雅撒, 亞惜, 他哈, 西番雅, 亞撒利雅#西番雅, 約珥#亞撒利雅, 以利加拿#約珥, 亞瑪賽, 瑪哈, 以利加拿#瑪哈, 蘇弗, 陀亞, 以列#陀亞, 耶羅罕#以列, 以利加拿#耶羅罕甲, 撒母耳#希幔線, 約珥#希幔之父, {id: 希幔, mark: main, note: 哥轄族，站在中間}]
    - ref: "6:39-43"
      chain: [革順, 雅哈, 示每#雅哈, 薪瑪, 以探#薪瑪, 亞大雅#以探, 謝拉#亞大雅, 伊特尼, 瑪基雅#伊特尼, 巴西雅, 米迦勒#巴西雅, 示米亞#米迦勒, 比利家#示米亞, {id: 亞薩, mark: main, note: "革順族，「在希幔右邊供職」"}]
    - ref: "6:44-47"
      chain: [米拉利, 母示, 末力, 沙麥, 巴尼#沙麥, 暗西, 希勒家#暗西, 亞瑪謝#希勒家, 哈沙比雅#亞瑪謝, 瑪鹿, 亞伯底, 基示, {id: 以探, mark: main, note: "米拉利族，「在他們左邊供職」"}]
    - ref: "6:48"
      covers: true
      note: 「他們的族弟兄利未人也被派辦神殿中的一切事」。
  notes:
    - text: 6:33–38 和 6:22–28 都有撒母耳一家，兩份名單有幾個名字不同（見上一段的讀經提醒）。這裡的撒母耳和 6:27 的撒母耳是同一人，因兩份名單無法逐一對齊，所以分開畫。
      refs: "6:27-28, 6:33"
    - text: 亞薩的家系從革順直接接到雅哈（6:43）；6:20 則是革順、立尼、雅哈。
      refs: "6:20, 6:43"

- id: c6d
  chapter: 6
  title: 亞倫子孫的職分
  range: "6:49-53"
  intro: 祭司的工作只屬於亞倫的子孫。6:50–53 重述 6:4–8 的大祭司家系，到撒督的兒子亞希瑪斯為止。
  statements:
    - ref: "6:49"
      covers: true
      note: 亞倫和他的子孫「在燔祭壇和香壇上獻祭燒香，又在至聖所辦理一切的事，為以色列人贖罪」。
    - ref: "6:50-53"
      chain: [亞倫, 以利亞撒, 非尼哈, 亞比書, 布基, 烏西, 西拉希雅, 米拉約, 亞瑪利雅, 亞希突, 撒督, 亞希瑪斯]

- id: c6e
  chapter: 6
  title: 利未人的城邑
  range: "6:54-81"
  intro: 利未人沒有一塊自己的地，而是散住在各支派中間的城邑。完整城名見文末「利未人的城邑」表。
  statements:
    - ref: "6:54-56"
      covers: true
      note: 亞倫的子孫先抽籤，得了希伯崙和四圍的郊野；「只是屬城的田地和村莊都為耶孚尼的兒子迦勒所得」。
    - ref: "6:61-63"
      covers: true
      note: 哥轄族其餘的人「在瑪拿西半支派的地中得了十座城」，革順族得了「十三座城」，米拉利族得了「十二座城」。
    - ref: "6:64-65"
      covers: true
      note: 「以色列人將這些城與其郊野給了利未人」，都是「拈鬮」分配。

# ───────────────────────── 第 7 章 ─────────────────────────
- id: c7a
  chapter: 7
  title: 以薩迦
  range: "7:1-5"
  intro: 以薩迦的記載重點在人數：每一家能出戰的勇士有多少。
  statements:
    - ref: "7:1"
      parent: 以薩迦
      children: [陀拉, 普瓦, 雅述, 伸崙]
    - ref: "7:2"
      parent: 陀拉
      children: [烏西#陀拉, 利法雅#陀拉, 耶勒, 雅買, 易伯散, 示母利]
    - ref: "7:3"
      parent: 烏西#陀拉
      parent_as: 烏西
      children: [伊斯拉希]
    - ref: "7:3"
      parent: 伊斯拉希
      children: [米迦勒#伊斯拉希, 俄巴底亞#伊斯拉希, 約珥#伊斯拉希, 伊示雅]
      note: 7:3：伊斯拉希和四個兒子「共五人，都是族長」。
    - ref: "7:4-5"
      covers: true
      note: 他們率領的軍隊「共有三萬六千人，因為他們的妻和子眾多」；以薩迦全族的勇士「共有八萬七千人」。

- id: c7b
  chapter: 7
  title: 便雅憫（第一份名單）
  range: "7:6-12"
  intro: 這裡的便雅憫有三個兒子；第 8 章另有一份不同的名單。
  statements:
    - ref: "7:6"
      parent: 便雅憫
      children: [比拉#便雅憫, 比結, 耶疊]
    - ref: "7:7"
      parent: 比拉#便雅憫
      parent_as: 比拉
      children: [以斯本, 烏西#比拉, 烏薛#比拉, 耶利摩#比拉, 以利]
    - ref: "7:8-9"
      parent: 比結
      children: [細米拉, 約阿施#比結, 以利以謝, 以利約乃#比結, 暗利, 耶利摩#比結, 亞比雅#比結, 亞拿突, 亞拉篾#比結]
    - ref: "7:10"
      chain: [耶疊, 比勒罕]
    - ref: "7:10-11"
      parent: 比勒罕
