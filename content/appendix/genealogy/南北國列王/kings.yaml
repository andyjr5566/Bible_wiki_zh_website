  prose:
    text: 米拿現殺了沙龍篡位，作王十年。提斐薩人不給他開城門，他就攻打那城，「剖開其中所有的孕婦」。亞述王普勒來攻，他向國中的富戶每人徵收五十舍客勒銀子，給了亞述王一千他連得，亞述王就回去了。
