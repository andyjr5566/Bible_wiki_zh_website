# 民數記20–30 章（曠野後期的敘事不收；女兒的產業、各節期的祭物、許願）。
book: 民數記
chapters:
  - chapter: 20
    excluded:
      - { verses: "1-29", reason: 米利暗之死、磐石出水、以東不容借路、亞倫之死的敘事 }
    sections: []
  - chapter: 21
    excluded:
      - { verses: "1-35", reason: 銅蛇、行程與擊敗西宏、噩的敘事與詩歌 }
    sections: []
  - chapter: 22
    excluded:
      - { verses: "1-41", reason: 巴勒請巴蘭咒詛以色列的敘事 }
    sections: []
