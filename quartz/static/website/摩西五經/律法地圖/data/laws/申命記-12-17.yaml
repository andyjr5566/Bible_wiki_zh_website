# 申命記12–17 章（獻祭的地方、背道的處置、食物與十分之一、豁免年與節期、審判官與君王）。
book: 申命記
chapters:
  - chapter: 12
    excluded:
      - { verses: "1", reason: 要謹守遵行的律例典章的引言 }
    sections:
      - id: deut12-s1
        title: 毀壞外邦的地方，在耶和華選擇的地方敬拜
        verses: 2-14
        laws:
          - id: deut12-02
            title: 毀壞外邦人事奉神的各地方，不可照他們那樣事奉耶和華
            refs: ["2-4"]
            topics: [altar-tabernacle, idolatry]
            summary: 要把所趕出的國民事奉神的各地方，無論在高山、小山、青翠樹下，都毀壞了，拆毀祭壇，打碎柱像，用火焚燒木偶，砍下神像，使他們的名從那地方除滅；不可照他們那樣事奉耶和華。
            basis: [2, 3, 4]
            entries: [毀滅迦南偶像的三道命令]
          - id: deut12-05
            title: 在耶和華選擇立他名的居所，獻祭並歡樂
            refs: ["5-7"]
            topics: [altar-tabernacle, offerings, tithes]
            summary: 耶和華從各支派中選擇立他名的居所，你們就當往那裡去求問，將燔祭、平安祭、十分取一之物、舉祭、還願祭、甘心祭和頭生的都帶到那裡，與家屬在耶和華面前吃，因蒙福而歡樂。
            basis: [5, 6, 7]
          - id: deut12-08
            title: 不可各人行自己眼中看為正的，要等到住在安息地
            refs: ["8-12"]
            topics: [altar-tabernacle, offerings]
            summary: 你們將來不可各行己眼中看為正；住在安息地後，要把供物帶到耶和華所選擇的居所，與兒女、僕婢、利未人在他面前歡樂。
            basis: [8, 10, 11, 12]
            why: [9]
          - id: deut12-13
            title: 不可在所看中的各處獻燔祭
            refs: ["13-14"]
            topics: [altar-tabernacle, burnt-offering]
            summary: 你要謹慎，不可在你所看中的各處獻燔祭；惟獨在耶和華從你那一支派中所選擇的地方，你才獻燔祭，行他一切所吩咐你的。
            basis: [13, 14]
            entries: [燔祭]
      - id: deut12-s2
        title: 在各城裡宰牲吃肉，不可吃血
        verses: 15-28
        laws:
          - id: deut12-15
            title: 在各城裡可以隨心所欲宰牲吃肉，只是不可吃血
            refs: ["15-16"]
            topics: [clean-food, blood-fat]
            summary: 在你各城裡，都可以照耶和華所賜的福分，隨心所欲宰牲吃肉，無論潔淨人不潔淨人都可以吃，像吃羚羊與鹿一般；只是不可吃血，要倒在地上，如同倒水一樣。
            basis: [15, 16]
            entries: [脂油和血都不可吃]
          - id: deut12-17
            title: 十分之一、頭生的、許願的，要在所選擇的地方吃，不可丟棄利未人
            refs: ["17-19"]
            topics: [tithes, firstborn, levites]
            summary: 五穀、新酒和油的十分之一，頭生的，許願和甘心獻的，不可在城裡吃，要在耶和華所選擇的地方，與兒女、僕婢和利未人一同吃；在你所住的地方永不可丟棄利未人。
            basis: [17, 18, 19]
          - id: deut12-20
            title: 離聖所太遠，可在城裡隨心所欲吃肉，不可吃血，因為血是生命
            refs: ["20-25"]
            topics: [clean-food, blood-fat]
            summary: 耶和華擴張境界、所選之地太遠時，可在城裡宰牛羊，潔淨和不潔淨的人都可吃；但不可吃血，因血是生命，要倒在地上如倒水。
            basis: [20, 21, 22, 23, 24, 25]
            why: [23]
            entries: [脂油和血都不可吃]
          - id: deut12-26
            title: 分別為聖的物要奉到所選擇的地方，燔祭連肉帶血獻在壇上
            refs: ["26-28"]
            topics: [altar-tabernacle, burnt-offering]
            summary: 你分別為聖的物和還願祭要奉到所選之處；燔祭連肉帶血獻在壇上，平安祭的血也倒在壇上、肉可吃；要謹守一切話。
            basis: [26, 27, 28]
            why: [28]
            entries: [燔祭]
      - id: deut12-s3
        title: 不可隨從外邦的惡俗
        verses: 29-32
        laws:
          - id: deut12-29
            title: 不可隨從外邦的惡俗，不可訪問他們的神，吩咐的話不可加減
            refs: ["29-32"]
            topics: [idolatry]
            summary: 得了他們的地居住，要謹慎，不可在他們除滅之後隨從他們的惡俗，陷入網羅，也不可訪問他們的神；你不可向耶和華你的神這樣行；凡我所吩咐的，你們都要謹守遵行，不可加添，也不可刪減。
            basis: [29, 30, 31, 32]
            why: [31]
  - chapter: 13
    excluded: []
    sections:
      - id: deut13-s1
        title: 引誘人事奉別神的處置
        verses: 1-18
        laws:
          - id: deut13-01
            title: 先知或做夢的人引人隨從別神，不可聽，要治死
            refs: ["1-5"]
            topics: [courts, idolatry]
            summary: 先知或做夢的人顯神蹟奇事，對你說「我們去事奉別神吧」，即使神蹟應驗了，也不可聽他的話，因為這是耶和華試驗你們；你們要順從、敬畏、事奉耶和華；那先知既叛逆耶和華，就要治死。
            basis: [1, 2, 3, 4, 5]
            why: [3]
          - id: deut13-06
            title: 親人暗中引誘你事奉別神，不可依從，要用石頭打死
            refs: ["6-11"]
            topics: [courts, idolatry]
            summary: 弟兄、兒女、懷中的妻或朋友，暗中引誘你去事奉別神，你不可依從，眼不可顧惜，也不可遮庇，總要殺他，你先下手，然後眾民也下手，用石頭打死他；以色列眾人聽見害怕，就不敢再行這樣的惡。
            basis: [6, 8, 9, 10, 11]
            why: [10]
          - id: deut13-12
            title: 一座城的匪類勾引居民背道，要探聽查究，屬實就殺盡
            refs: ["12-18"]
            topics: [courts, war, idolatry]
            summary: 聽人說有些匪類從一座城出來，勾引居民去事奉別神，就要探聽、查究；果然是真，就要用刀殺那城裡的居民和牲畜，把奪的財物堆在街市上，用火焚燒；當毀滅的物連一點都不可粘你的手。
            basis: [12, 14, 15, 16, 17]
            why: [17]
  - chapter: 14
    excluded: []
    sections:
      - id: deut14-s1
        title: 歸耶和華為聖潔的民
        verses: 1-2
        laws:
          - id: deut14-01
            title: 不可為死人用刀劃身，不可將額上剃光
            refs: ["1-2"]
            topics: [one-god, corpse]
            summary: 你們是耶和華你們神的兒女，不可為死人用刀劃身，也不可將額上剃光，因為你歸耶和華你神為聖潔的民。
            basis: [1, 2]
            why: [2]
      - id: deut14-s2
        title: 可吃與不可吃的
        verses: 3-21
        laws:
          - id: deut14-03
            title: 可憎的物不可吃；走獸中蹄分兩瓣又倒嚼的可以吃
            refs: ["3-8"]
            topics: [clean-food]
            summary: 凡可憎的物都不可吃；牛、綿羊、山羊、鹿、羚羊等，凡分蹄成為兩瓣又倒嚼的走獸都可以吃；駱駝、兔子、沙番倒嚼不分蹄，豬分蹄卻不倒嚼，與你們不潔淨，肉不可吃，死的也不可摸。
            basis: [3, 4, 5, 6, 7, 8]
            why: [7, 8]
          - id: deut14-09
            title: 水中有翅有鱗的可以吃，無翅無鱗的不可吃
            refs: ["9-10"]
            topics: [clean-food]
            summary: 水中凡有翅有鱗的都可以吃；凡無翅無鱗的都不可吃，是與你們不潔淨。
            basis: [9, 10]
          - id: deut14-11
            title: 潔淨的鳥可以吃，鵰、鷹、烏鴉、貓頭鷹等不可吃
            refs: ["11-20"]
            topics: [clean-food]
            summary: 凡潔淨的鳥都可以吃；不可吃的有鵰、鷹、烏鴉、鴕鳥、夜鷹、貓頭鷹、鵜鶘、禿鵰、鸕鶿、鸛、鷺鷥、戴鵀與蝙蝠等；凡有翅膀爬行的物不潔淨，都不可吃。
            basis: [11, 12, 13, 14, 15, 16, 17, 18, 19]
          - id: deut14-21
            title: 自死的不可吃，不可煮山羊羔
            refs: ["21"]
            topics: [clean-food]
            summary: 凡自死的都不可吃，可以給城裡寄居的吃，或賣給外人吃，因為你是歸耶和華你神為聖潔的民；不可用山羊羔母的奶煮山羊羔。
            basis: [21]
            why: [21]
      - id: deut14-s3
        title: 十分之一
        verses: 22-29
        laws:
          - id: deut14-22
            title: 田地所出的十分取一，在所選擇的地方吃，路遠可換成銀子
            refs: ["22-27"]
            topics: [tithes, levites]
            summary: 要把田地每年所出的十分取一，連同牛羊頭生的，在耶和華所選擇的地方吃，好學習常敬畏他；路途太遠，可以換成銀子，到所選擇的地方去，隨心所欲買了，與家人同吃喝歡樂；不可丟棄利未人。
            basis: [22, 23, 24, 25, 26, 27]
            why: [23, 27]
            entries: [三種什一奉獻的區分]
          - id: deut14-28
            title: 每三年的末一年，十分之一積存在城中，給利未人、寄居的和孤寡
            refs: ["28-29"]
            topics: [tithes, sojourner, poor]
            summary: 每逢三年的末一年，要將本年的土產十分之一都取出來，積存在城中；城裡無分無業的利未人、寄居的和孤兒寡婦，都可以來吃得飽足，這樣耶和華必在你手裡所辦的一切事上賜福與你。
            basis: [28, 29]
            why: [29]
            entries: [三種什一奉獻的區分]
  - chapter: 15
    excluded:
      - { verses: "4-6", reason: 留意聽從之後，百姓中沒有窮人、蒙福的應許 }
    sections:
      - id: deut15-s1
        title: 第七年的豁免
        verses: 1-11
        laws:
          - id: deut15-01
            title: 每逢七年末一年，豁免弟兄的債
            refs: ["1-3"]
            topics: [sabbath-year, loans, poor]
            summary: 每逢七年末一年要施行豁免：債主要把借給鄰舍的豁免了，不可向鄰舍和弟兄追討；借給外邦人可以追討，借給弟兄要鬆手豁免。
            basis: [1, 2, 3]
            why: [2]
            entries: [安息年]
          - id: deut15-07
            title: 對窮乏的弟兄要鬆開手
            refs: ["7-11"]
            topics: [loans, poor]
            summary: 弟兄中若有窮人，不可忍著心、揝著手不幫補，總要向他鬆開手，照他所缺乏的借給他；不可因第七年的豁免年快到了，就什麼都不給他。
            basis: [7, 8, 9]
            why: [10]
      - id: deut15-s2
        title: 第七年讓人走出去
        verses: 12-18
        laws:
          - id: deut15-12
            title: 釋放希伯來弟兄不可空手
            refs: ["12-18"]
            topics: [slavery]
            summary: 希伯來男女奴服事六年，第七年自由，不可空手去，要多給羊群、禾場、酒醡出產；若願留下就刺耳作永遠奴僕，不可為釋放為難。
            basis: [12, 13, 14, 16, 17, 18]
            why: [15]
      - id: deut15-s3
        title: 頭生的牲畜
        verses: 19-23
        laws:
          - id: deut15-19
            title: 頭生的公牲畜歸耶和華，不可耕種或剪毛，要在所選擇的地方吃
            refs: ["19-23"]
            topics: [firstborn, offerings, blood-fat]
            summary: 牛群羊群中頭生的公牲畜要分別為聖歸耶和華，牛頭生的不可用來耕地，羊頭生的不可剪毛；每年要在所選擇的地方吃；有殘疾的不可獻，可在城裡吃，只是不可吃血，要倒在地上，如同倒水一樣。
            basis: [19, 20, 21, 22, 23]
            entries: [頭生歸神]
  - chapter: 16
    excluded: []
    sections:
      - id: deut16-s1
        title: 逾越節與七七節、住棚節
        verses: 1-17
        laws:
          - id: deut16-01
            title: 在所選擇的地方守逾越節，吃無酵餅七日
            refs: ["1-8"]
            topics: [passover]
            summary: 要注意亞筆月，向耶和華守逾越節；在耶和華所選擇立他名的居所獻逾越節的祭牲，不在各城中獻；七日之內要吃無酵餅，頭一日晚上所獻的肉不可留到早晨；第七日要守嚴肅會，不可做工。
            basis: [1, 2, 3, 4, 5, 6, 8]
            why: [3]
            entries: [逾越節, 無酵節]
          - id: deut16-09
            title: 數七七日，守七七節，與眾人一同歡樂
            refs: ["9-12"]
            topics: [weeks]
            summary: 從開鐮收割禾稼時算起，共計七七日，照耶和華所賜的福，手裡拿著甘心祭，守七七節；你和兒女、僕婢、利未人、寄居的與孤兒寡婦，都要在所選擇的居所歡樂；也要記念你在埃及作過奴僕。
            basis: [9, 10, 11]
            why: [12]
            entries: [七七節（五旬節）]
          - id: deut16-13
            title: 收藏之後守住棚節七日
            refs: ["13-15"]
            topics: [booths]
            summary: 把禾場的穀、酒醡的酒收藏以後，就要守住棚節七日；守節的時候，你和兒女、僕婢、利未人、寄居的與孤兒寡婦都要歡樂；在耶和華所選擇的地方守節七日，因為他必賜福與你。
            basis: [13, 14, 15]
            why: [15]
          - id: deut16-16
            title: 一年三次在所選擇的地方朝見，不可空手
            refs: ["16-17"]
            topics: [three-feasts]
            summary: 一切的男丁要在除酵節、七七節、住棚節，一年三次，在耶和華所選擇的地方朝見他，不可空手朝見；各人要按自己的力量，照所賜的福分奉獻禮物。
            basis: [16, 17]
      - id: deut16-s2
        title: 審判與敬拜的界線
        verses: 18-22
        laws:
          - id: deut16-18
            title: 設立審判官，不可屈枉正直，不可受賄賂
            refs: ["18-20"]
            topics: [courts]
            summary: 要在各城裡按著各支派設立審判官和官長，他們必按公義的審判判斷百姓；不可屈枉正直，不可看人的外貌，也不可受賄賂；你要追求至公至義。
            basis: [18, 19, 20]
            why: [19]
          - id: deut16-21
            title: 為耶和華築壇，不可栽木偶，不可設立柱像
            refs: ["21-22"]
            topics: [altar-tabernacle, idolatry]
            summary: 你為耶和華你的神築壇，不可在壇旁栽什麼樹木作為木偶，也不可為自己設立柱像，這是耶和華你神所恨惡的。
            basis: [21, 22]
            why: [22]
  - chapter: 17
    excluded: []
    sections:
      - id: deut17-s1
        title: 祭牲、背道與審判
        verses: 1-13
        laws:
          - id: deut17-01
            title: 有殘疾或惡病的牛羊不可獻給耶和華
            refs: ["1"]
            topics: [offerings]
            summary: 凡有殘疾或有什麼惡病的牛羊，你都不可獻給耶和華你的神，因為這是耶和華你神所憎惡的。
            basis: [1]
            why: [1]
          - id: deut17-02
            title: 行耶和華眼中看為惡的事、拜別神，查實後用石頭打死
            refs: ["2-5"]
            topics: [courts, idolatry]
            summary: 若有人或男或女，行耶和華眼中看為惡的事，去事奉敬拜別神，或拜日月天象；有人告訴你，你就要細細地探聽，果然是真，就要將這人拉到城門外，用石頭打死。
            basis: [2, 3, 4, 5]
          - id: deut17-06
            title: 要憑兩三個人的口作見證，見證人先下手
            refs: ["6-7"]
            topics: [courts]
            summary: 要憑兩三個人的口作見證，將那當死的人治死，不可憑一個人的口作見證；見證人要先下手，然後眾民也下手，這樣就把那惡從你們中間除掉。
            basis: [6, 7]
            why: [7]
          - id: deut17-08
            title: 難斷的案件，要上到所選擇的地方去見祭司和審判官
            refs: ["8-13"]
            topics: [courts, priests]
            summary: 城中有難斷的案件，就當上到耶和華所選擇的地方，去見祭司利未人和審判官，求問他們；他們指示的判語，你必照著遵行，不可偏離左右；擅敢不聽從的，必治死，眾百姓聽見害怕。
            basis: [8, 9, 10, 11, 12, 13]
            why: [12, 13]
      - id: deut17-s2
        title: 立王的規矩
        verses: 14-20
        laws:
          - id: deut17-14
            title: 要立耶和華所揀選的人為王，必從弟兄中立一人
            refs: ["14-15"]
            topics: [leaders]
            summary: 到了所賜的地，若說「我要立王治理我」，你總要立耶和華你神所揀選的人為王；必從你弟兄中立一人，不可立你弟兄以外的人為王。
            basis: [14, 15]
          - id: deut17-16
            title: 王不可加添馬匹、多立妃嬪、多積金銀
            refs: ["16-17"]
            topics: [leaders]
            summary: 王不可為自己加添馬匹，也不可使百姓回埃及去為要加添他的馬匹；他不可為自己多立妃嬪，恐怕他的心偏邪，也不可為自己多積金銀。
            basis: [16, 17]
            why: [16, 17]
          - id: deut17-18
            title: 王要抄錄律法書，平生誦讀
            refs: ["18-20"]
            topics: [leaders]
