<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="互動式聖經會幕的非商業 3D 教育與研讀世界" />
    <title>互動式聖經會幕｜3D 空間研讀</title>
    <style>
      #file-protocol-help {
        display: none;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 2rem;
        place-content: center;
        background: #11120f;
        color: #f1e8cf;
        font-family: system-ui, sans-serif;
        line-height: 1.7;
      }
      #file-protocol-help .help-card {
        width: min(42rem, 100%);
        padding: 2rem;
        border: 1px solid #8f7a45;
        border-radius: 1rem;
        background: #211f18;
      }
      #file-protocol-help h1 { margin-top: 0; font-size: 1.5rem; }
      #file-protocol-help code {
        display: inline-block;
        padding: 0.15rem 0.4rem;
        border-radius: 0.3rem;
        background: #0b0c0a;
        color: #f2cf75;
      }
      html[data-file-protocol] #app { display: none; }
      html[data-file-protocol] #file-protocol-help { display: grid; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <aside id="file-protocol-help" role="alert">
      <div class="help-card">
        <h1>這個互動網站不能直接用 file:// 開啟</h1>
        <p>瀏覽器會阻擋 ES module、JSON 與 3D 模型載入，因此直接雙擊檔案會顯示空白。</p>
        <p>請在此章節資料夾執行：</p>
        <p><code>npm run dev</code></p>
        <p>再用瀏覽器開啟 <code>http://127.0.0.1:3001/</code>。</p>
        <p>正式部署請使用 <code>npm run build</code>，並由 HTTP 靜態主機提供 <code>dist/</code>。</p>
      </div>
    </aside>
    <script>
      if (window.location.protocol === 'file:') {
        document.documentElement.dataset.fileProtocol = 'true';
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
