      note: 7:11 稱他們「都是耶疊的兒子」。
    - ref: "7:12"
      parent: 以珥
      new_parent: true
      children: [書品, 戶品]
    - ref: "7:12"
      parent: 亞黑
      new_parent: true
      children: [戶伸]
  notes:
    - text: 7:6 列便雅憫的兒子是比拉、比結、耶疊；8:1–2 列的是比拉、亞實別、亞哈拉、挪哈、拉法。比拉的兒子兩處也不一樣（7:7 和 8:3–5）。
      refs: "7:6-7, 8:1-5"

- id: c7c
  chapter: 7
  title: 拿弗他利
  range: "7:13"
  intro: 只有一節，列出四個兒子。
  statements:
    - ref: "7:13"
      parent: 拿弗他利
      children: [雅薛, 沽尼, 耶色, 沙龍#拿弗他利]
      note: 7:13：「這都是辟拉的子孫」。

- id: c7d
  chapter: 7
  title: 河西的瑪拿西
  range: "7:14-19"
  intro: 瑪拿西的兒子瑪吉是「基列之父」。這一段提到西羅非哈只有女兒，和基甸所屬的亞比以謝家。
  statements:
    - ref: "7:14"
      parent: 瑪拿西#支派
      parent_as: 瑪拿西
      new_parent: true
      mother: 妾亞蘭人
      children: [亞斯列]
    - ref: "7:14"
      parent: 瑪拿西#支派
      parent_as: 瑪拿西
      children: [{id: 瑪吉, of: 基列, of_word: 之父}]
    - ref: "7:15"
      parent: 瑪拿西#支派
      parent_as: 瑪拿西
      children: [{id: 西羅非哈, note: "次子；「但有幾個女兒」"}]
      note: 7:15：瑪吉的妻子叫瑪迦，「是戶品、書品的妹子」。
    - ref: "7:16"
      parent: 瑪吉
      mother: 瑪迦
      children: [毘利施]
    - ref: "7:16"
      parent: 瑪吉
      parent_in_text: false
      children: [{id: 示利施, pnote: 經文作「毘利施的兄弟」}]
    - ref: "7:16"
      parent: 示利施
      children: [烏蘭#示利施, 利金]
    - ref: "7:17"
      parent: 烏蘭#示利施
      parent_as: 烏蘭
      children: [比但]
    - ref: "7:17"
      parent: 瑪吉
      children: [基列]
      note: 7:17：「這都是基列的子孫。基列是瑪吉的兒子，瑪吉是瑪拿西的兒子」。
    - ref: "7:18"
      parent: 基列
      rel: 妹子
      children: [哈摩利吉]
    - ref: "7:18"
      parent: 哈摩利吉
      children: [伊施荷, 亞比以謝, 瑪拉]
    - ref: "7:19"
      parent: 示米大
      new_parent: true
      children: [亞現, 示劍, 利克希, 阿尼安]
  notes:
    - text: 7:15 說「瑪拿西的次子名叫西羅非哈」；民數記 27:1 說西羅非哈是「瑪拿西的玄孫，瑪吉的曾孫，基列的孫子，希弗的兒子」。
      refs: "7:15, 民 27:1"

- id: c7e
  chapter: 7
  title: 以法蓮，和約書亞的家系
  range: "7:20-29"
  intro: 以法蓮的兒子被迦特人殺害之後，他給新生的兒子取名比利亞。從比利亞往下第十代是約書亞。
  spine: [比利亞#以法蓮, 約書亞]
  statements:
    - ref: "7:20-21"
      new_root: true
      chain: [以法蓮, 書提拉, 比列, 他哈#比列, 以拉大, 他哈#以拉大, 撒拔#他哈, 書提拉#撒拔]
    - ref: "7:21"
      parent: 以法蓮
      children: [以謝, 以列#以法蓮]
      note: 以謝和以列「因為下去奪取迦特人的牲畜，被本地的迦特人殺了」。
    - ref: "7:22"
      covers: true
      note: 「他們的父親以法蓮為他們悲哀了多日，他的弟兄都來安慰他」。
    - ref: "7:23"
      parent: 以法蓮
      children: [{id: 比利亞#以法蓮, mark: main, note: "因為「家裡遭禍」而取這個名字"}]
    - ref: "7:24"
      parent: 以法蓮
      parent_in_text: false
      rel: 女
      children: [{id: 舍伊拉, note: "「建築上伯和崙、下伯和崙與烏羨舍伊拉的」"}]
    - ref: "7:25"
      parent: 比利亞#以法蓮
      parent_as: 比利阿
      children: [利法, {id: 利悉, mark: main}]
    - ref: "7:25-27"
      chain: [利悉, {id: 他拉#利悉, mark: main}, {id: 他罕, mark: main}, {id: 拉但, mark: main}, {id: 亞米忽, mark: main}, {id: 以利沙瑪, mark: main}, {id: 嫩, mark: main}, {id: 約書亞, mark: main}]
    - ref: "7:28-29"
      label: 以法蓮和瑪拿西的住處
      places: [伯特利, 拿蘭, 基色, 示劍, 迦薩, 伯善, 他納, 米吉多, 多珥]
      note: 「以色列兒子約瑟的子孫住在這些地方」。
  notes:
    - text: 7:24 說「他的女兒名叫舍伊拉」，這裡照上下文掛在以法蓮名下。7:25 把比利亞寫作「比利阿」。
      refs: "7:24-25"

