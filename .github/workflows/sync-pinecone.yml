name: Sync Pinecone embeddings

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "scripts/generate_embeddings.js"
      - "api/slug.js"
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Delete the namespace and rebuild every searchable page"
        required: true
        default: false
        type: boolean
      sync_commit:
        description: "Sync content changes from a specific commit, for example d0bb478"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect changed content files
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_REBUILD_INPUT: ${{ inputs.full_rebuild }}
          SYNC_COMMIT: ${{ inputs.sync_commit }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$FULL_REBUILD_INPUT" == "true" ]]; then
              : > changed-files.txt
            elif [[ -n "$SYNC_COMMIT" ]]; then
              if ! [[ "$SYNC_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
                echo "sync_commit must be a commit SHA"
                exit 1
              fi
              git rev-parse --verify "${SYNC_COMMIT}^{commit}" >/dev/null
              git -c core.quotePath=false diff --name-only "${SYNC_COMMIT}^" "$SYNC_COMMIT" -- content > changed-files.txt
            else
              : > changed-files.txt
            fi
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git -c core.quotePath=false diff-tree --no-commit-id --name-only -r "$AFTER_SHA" -- content > changed-files.txt
          else
            git -c core.quotePath=false diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- content > changed-files.txt
          fi
          echo "Changed files:"
          cat changed-files.txt

      - name: Sync embeddings
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          CHANGED_FILES_FILE: changed-files.txt
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_rebuild || 'false' }}
        run: node scripts/generate_embeddings.js
