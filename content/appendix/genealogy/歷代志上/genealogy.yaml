      children: [毘拉提#哈拿尼雅, 耶篩亞]
    - ref: "3:21"
      roots: [{id: 利法雅#3:21, pnote: 經文作「利法雅的眾子」}, {id: 亞珥難, pnote: 經文作「亞珥難的眾子」}, {id: 俄巴底亞#3:21, pnote: 經文作「俄巴底亞的眾子」}, {id: 示迦尼, pnote: 經文作「示迦尼的眾子」}]
    - ref: "3:22"
      parent: 示迦尼
      children: [示瑪雅#示迦尼]
    - ref: "3:22"
      parent: 示瑪雅#示迦尼
