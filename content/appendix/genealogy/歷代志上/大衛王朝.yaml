sections:
- id: c10
  chapter: 10
  title: 掃羅和他的兒子們
  range: "10:1-14"
  intro: 歷代志上的敘事從掃羅戰死開始。掃羅家的家譜在族譜頁第 8、9 章，這一章寫他和三個兒子死在基利波山。
  statements:
    - {ref: "10:1", covers: true}
    - {ref: "10:2", parent: 掃羅, children: [約拿單, 亞比拿達#掃羅, 麥基舒亞]}
    - {ref: "10:3-13", covers: true}
    - {ref: "10:14", parent: 耶西, children: [大衛]}

- id: c11a
  chapter: 11
  title: 大衛在希伯崙受膏
  range: "11:1-9"
  intro: 以色列眾人到希伯崙膏大衛作王，大衛接著攻取錫安的保障。約押因為先上去攻打耶布斯人，作了元帥。
  statements:
    - {ref: "11:1-5", covers: true}
    - ref: "11:6"
      label: 先上去攻打耶布斯人的人
      roster:
        - {id: 約押, pos: 作了元帥, desc: 洗魯雅的兒子, ref: "11:6"}
    - {ref: "11:7-9", covers: true}

- id: c11b
  chapter: 11
  title: 三個勇士和兩位首領
  range: "11:10-25"
  intro: 大衛勇士名單的開頭。先是「軍長的統領」雅朔班，和「三個勇士裡的一個」以利亞撒；接著是三個勇士冒死到伯利恆打水；最後是兩位首領：約押的兄弟亞比篩，和後來作護衛長的比拿雅。
  statements:
    - {ref: "11:10", covers: true}
    - ref: "11:11-25"
      label: 三個勇士和兩位首領
      roster:
        - {id: 雅朔班#哈革摩尼之子, pos: 軍長的統領, desc: 哈革摩尼的兒子, ref: "11:11"}
        - {id: 以利亞撒#朵多之子, pos: 三個勇士裡的一個, desc: 亞合人朵多的兒子, ref: "11:12"}
        - {id: 亞比篩, pos: 這三個勇士的首領, desc: 約押的兄弟, ref: "11:20"}
        - {id: 比拿雅#耶何耶大之子, pos: 護衛長, desc: 甲薛勇士耶何耶大的兒子, ref: "11:22-25"}

