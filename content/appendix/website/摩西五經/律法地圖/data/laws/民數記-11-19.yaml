# 民數記11–19 章（曠野的怨言、探子與悖逆的敘事不收；獻祭的配料、誤犯與擅敢、繸子、祭司利未人的分、紅母牛）。
book: 民數記
chapters:
  - chapter: 11
    excluded:
      - { verses: "1-35", reason: 百姓在他備拉、基博羅哈他瓦的怨言、七十位長老受靈和鵪鶉的敘事 }
    sections: []
  - chapter: 12
    excluded:
      - { verses: "1-16", reason: 米利暗和亞倫毀謗摩西的敘事 }
    sections: []
