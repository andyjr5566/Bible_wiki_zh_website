  - id: booths
    kind: feast
    title: 住棚節
    date: 七月十五日起，共七日
    month: 7
    day: 15
    scene: booths-land
    palette:
      paper: '#eee5cb'
      ink: '#22301e'
      accent: '#5f7a2c'
      glow: '#f4d98e'
    passages:
      - 出23:16
      - 出34:22
      - 利23:33-43
      - 民29:12-38
      - 申16:13-15
      - 申31:10-13
    entries:
      - 住棚節（利23節期規定）
      - 住棚節四種植物
      - 住棚節公牛逐日遞減
      - 住棚節第八日的嚴肅會
      - 嚴肅會（a.Tze.ret）
      - 三大節期
    nt:
      - 約7：38-39 活水的江河
    ot:
      - kind: kept
        ref: 王上8:65-66
        note: 所羅門在七月獻殿，節期一連守了七日又七日，「第八日」遣散眾民，可以對照利23:36、39 的第八日。歷代志記同一次更細：第八日設立嚴肅會，七月二十三日才遣散（代下7:9-10）。
      - kind: kept
        ref: 拉3:4
        note: 律法書上住棚節每日當獻的燔祭，寫在民29:12-34，也就是本章長條圖的數目；和合本在民29:18 也用「按數照例」這四個字。他們那時連聖殿的根基都還沒立（拉3:6），就先照書上守節。
      - kind: kept
        ref: 摩5:21
        note: 節期和嚴肅會都是律法定的（利23:36），這裡神說厭惡，連燔祭、素祭、平安祭都不悅納。神要的寫在後面：「惟願公平如大水滾滾，使公義如江河滔滔」（摩5:24）。
      - kind: kept
        ref: 亞14:16-19
        note: 這是先知說的將來。律法說「凡以色列家的人」都要住在棚裡（利23:42）；這裡年年上耶路撒冷守住棚節的，是列國剩下的人，不上來的，地上就沒有雨。
      - kind: word
        ref: 珥1:14
        note: 「嚴肅會」是住棚節第八日的名稱（利23:36），原文是同一個字。這裡卻是在殿中的素祭和奠祭都斷絕的時候（珥1:13）召聚的：眾人禁食，到神的殿向耶和華哀求。
      - kind: word
        ref: 王下10:20-21
        note: 同一個字也用在拜巴力的聚會上：耶戶下令為巴力宣告嚴肅會，經文先說明這是詭計，要把拜巴力的人招齊殺盡（王下10:19）。「嚴肅會」是哪一種聚會，要看上下文。

