# 《至於我和我家》七段 36 拍完整故事資料
# 經文內文不手寫於此檔，由 build-site.mjs 自 src/data/verses.json 展開填入；
# 原文詞形與音譯亦不手寫於此檔，由 build-site.mjs 按 (verse, position) 自 src/data/step.json 精確複製。

segments:
  - id: prologue
    label: 序
    title: 七塊石頭
    rangeLabel: 書23:1-2 → 書24:1 之前
    beats:
      - id: beat-01-prologue
        cue: prologue
        space: prologue-bar
        bgVerses:
          - 書23:1-2
        summary: 以色列人進迦南以後，好幾次立石頭作記號。示劍這一次是第七次。
        commentaryPreview: CT 與 GT：進迦南後的第七次立石
        commentaries:
          - id: prologue-ct
            source: CT
            work: CT 黃迦勒《約書亞記註解》
            verse: 書24:27
            quote: 這是以色列人進入迦南地後，第七次立石作見證(參書四20；七26；八29，32；十27；二十二27)。
            line: 250
            evidence: 這是以色列人進入迦南地後，第七次立石作見證(參書四20；七26；八29，32；十27；二十二27)。
          - id: prologue-gt-study
            source: GT
            work: GT《約書亞記研經資料(蔡哲民等)》
            verse: 書24:26
            quote: 24：26 是約書亞進入迦南地後以色列人的第七次立石，以前六次分別在 4：20 7：26 8：29，32 10：27 22：27。
            line: 354
            evidence: 是約書亞進入迦南地後以色列人的第七次立石，以前六次分別在 4：20 7：26 8：29，32 10：27 22：27。
        entryLinks:
          - 主題/立石為證
        soundCue: prologue-wind

  - id: act-1
    label: 第一幕
    title: 聚集在示劍
    rangeLabel: 24:1
    treatyNote: 前言 1–2
    beats:
      - id: beat-02-gather
        cue: gather
        space: valley
        verse: 書24:1
        focusSubstrings:
          - 約書亞將以色列的眾支派聚集在示劍
        summary: 約書亞把以色列眾支派聚集到示劍。示劍在基利心山和以巴路山中間。
        placeLinks:
          - shechem
          - ebal
          - gerizim
        commentaryPreview: 示劍山谷的地理位置與考古背景
        commentaries:
          - id: gather-walton
            source: GT
            work: GT 華爾頓《約書亞記背景注釋》
            verse: 書24:1
            quote: 位於以法蓮山地，耶路撒冷以北三十五哩的示劍(巴拉塔遺址)，支配了基利心山和以巴路山之間的山隘和商道。
            paraphrase: 並指出示劍遺址的鐵器時代沒有毀滅層，約書亞攻取城市名單（書12:7-23）也未列示劍。
            line: 26
            evidence: 位於以法蓮山地，耶路撒冷以北三十五哩的示劍(巴拉塔遺址)，支配了基利心山和以巴路山之間的山隘和商道。
        entryLinks:
          - 地點/示劍（城）
          - 地點/基利心山與以巴路山
        soundCue: valley-morning

      - id: beat-03-leaders
        cue: leaders
        space: valley
        verse: 書24:1
        focusSubstrings:
          - 召了以色列的長老、族長、審判官，並官長來
        summary: 約書亞召來長老、族長、審判官和官長。他們走到橡樹前的空地。
        commentaryPreview: 四類領袖各自負責什麼
        commentaries:
          - id: leaders-ct
            source: CT
            work: CT 黃迦勒《約書亞記註解》
            verse: 書24:1
            paraphrase: 解釋長老是年長老練的全民代表，族長是支派宗族家族各級首領，審判官主持審理案件並下判決，官長輔佐審判官執行斷案。
            line: 22
            evidence: 以上四類名銜，是當時在民政上治理以色列百姓各級官長
          - id: leaders-bh
            source: BH
            work: BH BibleHub Study
            verse: 書24:1
            quote: Joshua did not treat covenant faithfulness as a private concern; the whole nation, from its leaders to its families, was accountable to the Lord.
            quoteZh: 約書亞並未把守約的忠誠當作私事；從領袖到家庭，整個國家都要向耶和華負責。
            line: 15
            evidence: Joshua did not treat covenant faithfulness as a private concern
        wordPreview: 四種領袖的原文詞形
        words:
          - id: word-v1-elders
            verse: 1
            position: 9
            label: 長老
            note: 這個字是『長老』的複數。字典的意思是年老的、長老。
          - id: word-v1-heads
            verse: 1
            position: 11
            label: 族長
            note: 字典的意思是頭、首領。這裡是複數，後面帶著『它的』，指以色列的首領。和合本譯作族長。
          - id: word-v1-judges
            verse: 1
            position: 12
            label: 審判官
            note: 這個字從動詞『審判』來，意思是審判的人。和合本譯作審判官。
          - id: word-v1-officers
            verse: 1
            position: 13
            label: 官長
            note: 字典的意思是官員。和合本譯作官長。
        soundCue: valley-morning

      - id: beat-04-before-god
        cue: before-god
        space: valley
        verse: 書24:1
        focusSubstrings:
          - 他們就站在神面前。
        summary: 眾人面向橡樹前的空地站好。經文說，他們站在神面前。
        commentaryPreview: 『站在神面前』：約櫃在不在這裡？兩派讀法
        commentaries:
          - id: before-god-ct
            source: CT
            work: CT 黃迦勒《約書亞記註解》
            verse: 書24:1
            quote: 『站在神面前』指站在約櫃面前。約櫃已經被從示羅運到這裡，見證百姓與神立約。
            line: 22
            evidence: 『站在神面前』指站在約櫃面前。約櫃已經被從示羅運到這裡
          - id: before-god-gt-jingdu
            source: GT
            work: GT《聖經精讀本──約書亞記註解》
            verse: 書24:26
            paraphrase: 指出當時會幕設在示羅（書18:1），不會為了特別的儀式隨處移動；第26節的聖所可以說是指以巴路山附近的壇，也有人認為是指示劍橡樹下的聖地。
            line: 348
            evidence: 因為當時會幕設立在示羅(18：1)，並不可能為了特別的儀式，隨處移動。
        entryLinks:
          - 事件/示劍更新盟約
        soundCue: valley-quiet

      - id: beat-05-family-1
        cue: family-1
        space: valley
        summary: 約瑟子孫的人群裡，女兒拉了拉爺爺的袖子。
        familyLines:
          - speaker: daughter
            kind: question
            text: 為什麼要在這棵橡樹下聚集？
          - speaker: grandfather
            kind: cuv-quote
            ref: 創12:6
            text: 亞伯蘭經過那地，到了示劍地方、摩利橡樹那裡。
          - speaker: grandfather
            kind: cuv-quote
            ref: 創12:7
            text: 耶和華向亞伯蘭顯現，說：我要把這地賜給你的後裔。
        daughterQA:
          question: 為什麼要在這棵橡樹下聚集？
          answerer: grandfather
          verses:
            - 創12:6-7
          entryLinks:
            - 地點/示劍（城）
            - 背景/摩利橡樹
          notes:
            - id: qa1-ct
              source: CT
              work: CT 黃迦勒《約書亞記註解》
              verse: 書24:1
              paraphrase: 指出亞伯拉罕進迦南首先在示劍築壇（創12:6-7），雅各回迦南在此築壇、清除偶像（創33:18-20；35:4），以色列人進迦南也在基利心山與以巴路山宣告祝福與咒詛（書8:30-35）。
              line: 20
              evidence: 亞伯拉罕進入迦南地之後，首先在示劍為神築壇，神在這裡第一次與亞伯拉罕立約
            - id: qa1-gt-study-events
              source: GT
              work: GT《約書亞記研經資料(蔡哲民等)》
              verse: 書24:1
              paraphrase: 同樣列出示劍的三件往事：亞伯拉罕築壇、雅各清除偶像、以色列人在基利心山與以巴路山宣講律法。
              line: 23
              evidence: 有關「示劍」發生過的歷史事件：a.亞伯拉罕進入迦南地之後
            - id: qa1-gt-study-odd
              source: GT
              work: GT《約書亞記研經資料(蔡哲民等)》
              verse: 書24:1
              quote: 通常約書亞記中以色列人都在吉甲、示羅集會，此處奇怪的是在示劍集會。
              line: 21
              evidence: 通常約書亞記中以色列人都在吉甲、示羅集會，此處奇怪的是在示劍集會。
        soundCue: valley-quiet

  - id: act-2
    label: 第二幕
    title: 是我做的
    rangeLabel: 24:2–13
    treatyNote: 歷史序言 2–13
    beats:
      - id: beat-06-beyond-river
        cue: beyond-river
        space: map
        verse: 書24:2
        interaction: only-i
        summary: 約書亞轉述耶和華的話。古時列祖住在大河那邊，亞伯拉罕的父親他拉在那裡事奉別神。
        note: GT《研經資料》：第2到13節每一段都以神為主角，神用第一人稱說話。
        placeLinks:
          - euphrates
          - ur
          - haran
        personLinks:
          - label: 他拉
            targetId: 他拉
          - label: 亞伯拉罕
            targetId: 亞伯拉罕
          - label: 拿鶴
            targetId: 拿鶴#他拉
        commentaryPreview: 大河那邊的吾珥、哈蘭與列祖事奉的別神
        commentaries:
          - id: beyond-ct
            source: CT
            work: CT 黃迦勒《約書亞記註解》
            verse: 書24:2
            quote: 『大河』指幼發拉底河；『大河那邊』即指迦勒底的吾珥(參創十一28)；『別神』即偶像假神。
            line: 31
            evidence: 『大河』指幼發拉底河；『大河那邊』即指迦勒底的吾珥
          - id: beyond-gt-jingdu
            source: GT
            work: GT《聖經精讀本──約書亞記註解》
            verse: 書24:2
            paraphrase: 說明他拉家人所事奉的別神是當時米所波大米普遍崇拜的月神；亞伯拉罕當初同樣身處偶像崇拜中，因神主權的恩典蒙召。
            line: 49
            evidence: 他拉的家人所事奉的“別神”就是當時的米所波大米人普遍崇拜的月神。
          - id: beyond-gt-comp
            source: GT
            work: GT《約書亞記綜合解讀》
            verse: 書24:2
            quote: 吾珥和哈蘭都是敬拜月神的中心，亞伯拉罕的家族和現在被神滅絕的迦南人一樣，都是拜偶像的。
            line: 51
            evidence: 吾珥和哈蘭都是敬拜月神的中心，亞伯拉罕的家族
        wordPreview: 『大河那邊』與本章第一個『事奉』
        words:
          - id: word-v2-beyond
            verse: 2
            position: 11
            label: 那邊
            note: 字典的意思是一邊、對面。和下一個字連起來，就是大河的那一邊。
          - id: word-v2-river
            verse: 2
            position: 12
            label: 大河
            note: 字典的意思是河，前面加了表示那一條的小字。CT 說這裡的大河指幼發拉底河。
          - id: word-v2-served
            verse: 2
            position: 21
            label: 事奉
            note: 本章第一次出現『事奉』這個動詞。這裡說的是列祖在大河那邊事奉別神。
          - id: word-v2-gods
            verse: 2
            position: 22
            label: 神（複數）
            note: 和第 1 節的『神』是同一個字，這裡指許多神。和下一個字合起來就是別神。
          - id: word-v2-other
            verse: 2
            position: 23
            label: 別（複數）
            note: 意思是別的，這裡是複數。GT《研經資料》指出，『別的』和『神』在原文都是複數。
        entryLinks:
          - 人物/他拉
          - 人物/亞伯拉罕
        soundCue: river-flow

      - id: beat-07-abraham
        cue: abraham
        space: map
        verse: 書24:3-4
        moreVerses:
          - 創50:26
        interaction: only-i
        summary: 神把亞伯拉罕從大河那邊帶來，領他走遍迦南，把以撒賜給他，又把雅各和以掃賜給以撒，把西珥山賜給以掃。後來雅各一家下到埃及。約瑟死後，棺材也停在埃及。
        placeLinks:
          - canaan-walk
          - hebron
          - seir
          - egypt
        personLinks:
          - label: 亞伯拉罕
            targetId: 亞伯拉罕
          - label: 以撒
            targetId: 以撒
          - label: 雅各
            targetId: 以色列
          - label: 以掃
            targetId: 以掃
          - label: 約瑟
            targetId: 約瑟
        commentaryPreview: 下埃及也在神的計畫裡嗎？
        commentaries:
          - id: abraham-tyndale
            source: GT
            work: GT《丁道爾聖經注釋》
            verse: 書24:4
            quote: 從頭開始，一直是神在掌控，每件事都是按照祂的計畫在進行，甚至包括下埃及在內。
            line: 103
            evidence: 從頭開始，一直是神在掌控，每件事都是按照祂的計畫在進行，甚至包括下埃及在內。
          - id: abraham-kc
            source: KC
            work: KC KingComments
            verse: 書24:4
            quote: He gives Esau Mount Seir as an inheritance, so that the land of Canaan will be entirely for the descendants of Jacob.
            quoteZh: 祂把西珥山賜給以掃為業，好叫迦南地完全歸給雅各的後裔。
            line: 35
            evidence: He gives Esau Mount Seir as an inheritance, so that the land of Canaan
        wordPreview: 第 3–4 節神說『我』的六個動詞，其中三次是『賜給』
        words:
          - id: word-v3-took
            verse: 3
            position: 1
            label: 我將…帶來
            note: 第 3 到 13 節，神用『我』做主詞的動詞一共有 20 個，這是第 1 個。字典的意思是拿、帶。
          - id: word-v3-led
            verse: 3
            position: 8
            label: 領
            note: 第 2 個『我』的動詞。這個字本來是走，這裡的形式是使他走，也就是領他走。和合本沒有再寫出我字。
          - id: word-v3-gave
            verse: 3
            position: 16
            label: 賜給
            note: 第 4 個『我』的動詞，也是本章第一次出現『給』這個字。第 4 節又用了兩次：把雅各和以掃賜給以撒，把西珥山賜給以掃。
        entryLinks:
          - 地點/西珥山
        soundCue: river-flow

      - id: beat-08-egypt
        cue: egypt
        space: map
        verse: 書24:5-7
        moreVerses:
          - 出13:19
        interaction: only-i
        summary: 神差摩西、亞倫降災給埃及，把百姓領出來。摩西把約瑟的骸骨一同帶走。到了紅海，埃及人追來，神使兩邊中間黑暗，又使海水淹沒埃及人。後來百姓在曠野住了許多年日。
        placeLinks:
          - egypt
          - rameses
          - redsea
          - sinai
          - kadesh
        personLinks:
          - label: 摩西
            targetId: 摩西
          - label: 亞倫
            targetId: 亞倫
        externalLinks:
          - kind: wilderness
            label: 在『曠野四十二站』看這段路（另開網頁）
        commentaryPreview: 為什麼對當天的聽眾說『你們親眼見過』？
        commentaries:
          - id: egypt-gt-comp
            source: GT
            work: GT《約書亞記綜合解讀》
            verse: 書24:5-7
            quote: 出埃及的時候，他們中間許多人已經出生，只是還不到二十歲，所以都經歷過十災和過紅海的神跡(5~7節)。
            line: 113
            evidence: 出埃及的時候，他們中間許多人已經出生，只是還不到二十歲
          - id: egypt-bh
            source: BH
            work: BH BibleHub Study
            verse: 書24:7
            quote: The pillar of cloud stood between Israel and Pharaoh’s army, bringing light to God’s people while bringing darkness to their enemies (Exodus 14:19–20).
            quoteZh: 雲柱立在以色列人與法老軍兵中間，一邊照亮神的子民，一邊使仇敵陷入黑暗（出14:19-20）。
            line: 215
            evidence: The pillar of cloud stood between Israel and Pharaoh’s army
        soundCue: sea-and-wind

      - id: beat-09-east
        cue: east
        space: map
        verse: 書24:8-10
        moreVerses:
          - 民22:6
          - 民23:11
        interaction: balak-scroll
        balakStages:
          - step: 1
            speaker: 摩押王巴勒差人求巴蘭
            ref: 民22:6
            quote: 現在求你來為我咒詛他們
          - step: 2
            speaker: 巴勒對巴蘭說
            ref: 民23:11
            quote: 不料，你竟為他們祝福。
          - step: 3
            speaker: 耶和華如此說
