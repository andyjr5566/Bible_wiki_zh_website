    - ref: "7:40"
      covers: true
      note: 「這都是亞設的子孫，都是族長，是精壯大能的勇士」，能出戰的「共有二萬六千人」。
  notes:
    - text: 7:32 希別的兒子是雅弗勒、朔默、何坦；7:35 又提到「朔默兄弟希連」，這裡掛在希別名下。7:38–39 的益帖和烏拉，經文沒有說是誰的兒子。
      refs: "7:32, 7:35, 7:38-39"

