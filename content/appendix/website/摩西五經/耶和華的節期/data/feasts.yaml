      - kind: kept
        ref: 拉6:19-20
        note: 被擄的人回來、聖殿剛修成（拉6:15），就在正月十四日守逾越節。經文特別交代祭司和利未人都自潔，沒有一人不潔淨；本站「二月逾越節」那一章裡，正是有幾個人因死屍而不潔淨，不能在那日守逾越節（民9:6）。
