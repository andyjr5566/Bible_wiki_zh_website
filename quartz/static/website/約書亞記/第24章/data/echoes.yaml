threeBurials:
  - id: burial-joshua
    person: 約書亞
    genealogyId: 約書亞
    ref: 書24:29-30
    placeName: 以法蓮山地的亭拿西拉（迦實山北邊）
    placeId: timnath-serah
    ageNote: 正一百一十歲（對照創50:26約瑟正一百一十歲）
    detail: 耶和華的僕人、嫩的兒子約書亞葬在他地業的境內；迦實山確實地點不詳。
    entryKey: 地點/亭拿西拉
    storyCue: joshua-dies
    notes:
      - id: burial-joshua-kc
        source: KC
        work: KC KingComments
        verse: 書24:29
        quote: He is called here for the first and also only time “the servant of the LORD”.
        quoteZh: 他在這裡第一次、也是全書唯一一次被稱為『耶和華的僕人』。
        line: 81
        evidence: He is called here for the first and also only time
      - id: burial-joshua-tyndale
        source: GT
        work: GT《丁道爾聖經注釋》
        verse: 書24:29
        quote: 約瑟也是一百一十歲去世(創五十26)。這個數字把將以色列帶進迦南的約書亞，和把以色列帶入埃及的祖先連在一起。它也為第32節提到約瑟鋪路。
        line: 379
        evidence: 這個數字把將以色列帶進迦南的約書亞，和把以色列帶入埃及的祖先連在一起。
  - id: burial-joseph
    person: 約瑟的骸骨
    genealogyId: 約瑟
    ref: 書24:32
    placeName: 示劍（雅各用一百塊銀子買的那塊地）
    placeId: shechem
    ageNote: 創50:26記載約瑟正一百一十歲去世，收殮在棺材裡停在埃及
    detail: 從創50:25約瑟起誓遺命、出13:19摩西把骸骨一同帶去，到書24:32葬在示劍，作了約瑟子孫的產業（另見來11:22；徒7:16）。
    entryKey: 歷史/約瑟骸骨葬於示劍
    storyCue: bones
    notes:
      - id: burial-joseph-kc
        source: KC
        work: KC KingComments
        verse: 書24:32
        quote: The burial of Joseph’s bones makes it clear that the book does not really end with death, because it shows the hope of the resurrection. With this in mind Joseph wanted his bones to be buried in the land (Heb 11:22).
        quoteZh: 約瑟骸骨的安葬顯明這卷書並非真的以死亡作結，因為它顯出復活的盼望；約瑟正是存著這盼望，吩咐把他的骸骨葬在這地（來11:22）。
        line: 91
        evidence: The burial of Joseph’s bones makes it clear that the book does not really end with death
      - id: burial-joseph-tyndale
        source: GT
        work: GT《丁道爾聖經注釋》
        verse: 書24:32
        paraphrase: 指出這裡重提約瑟遺骸與雅各買地，把約書亞記與創世記連起來，總結屬神子民如何從一個家族成為眾支派與國家。
        line: 420
        evidence: 便將約書亞記和創世記連起來，成為一個大時代的總結
  - id: burial-eleazar
    person: 大祭司以利亞撒
    genealogyId: 以利亞撒
    ref: 書24:33
    placeName: 以法蓮山地、他兒子非尼哈所得的小山
    placeId: gibeah-phinehas
    detail: 亞倫的兒子以利亞撒死了，葬在他兒子非尼哈所得的小山上；小山原文作基比亞，確實地點不詳。
    entryKey: 地點/基比亞（以法蓮）
    storyCue: eleazar
    notes:
      - id: burial-eleazar-ct
        source: CT
        work: CT 黃迦勒《約書亞記註解》
        verse: 書24:33
        quote: 『以利亞撒』當時的大祭司，死後大祭司的職任由他兒子非尼哈繼承
        line: 298
        evidence: 『以利亞撒』當時的大祭司，死後大祭司的職任由他兒子非尼哈繼承
      - id: burial-eleazar-gt-comp
        source: GT
        work: GT《約書亞記綜合解讀》
        verse: 書24:32-33
        quote: 現在這兩項任務都已經完成了，神就不再指定約書亞的接班人，而是安排非尼哈接替他父親以利亞撒做大祭司，維持人與神之間的交通。
        line: 434
        evidence: 神就不再指定約書亞的接班人，而是安排非尼哈接替他父親以利亞撒做大祭司

section05Title: 免得你忘記

lestForget:
  - id: forget-1-deut6
    order: 1
    stageLabel: 進那地之前，摩西預先提醒
    refs:
      - 申6:10-12
    storyCue: gifts
    notes:
      - id: forget-1-tyndale
        source: GT
        work: GT《丁道爾聖經注釋》
        verse: 書24:13
        quote: 這一節正像申命記六10~11一樣，用以色列從神白白得到的財富和祝福，來形容神的一切應許都已實現。
        line: 194
        evidence: 這一節正像申命記六10~11一樣，用以色列從神白白得到的財富和祝福
      - id: forget-1-study
        source: GT
        work: GT《約書亞記研經資料(蔡哲民等)》
        verse: 書24:13
        paraphrase: 指出書24:13與申6:10-11相呼應。
        line: 200
        evidence: 24：13 與 申 6：10~11 相呼應。
  - id: forget-2-fulfilled
    order: 2
    stageLabel: 分地完成與臨別之時
    refs:
      - 書21:43-45
      - 書23:14
    storyCue: prologue
    notes:
      - id: forget-2-bh
        source: BH
        work: BH BibleHub Study
        verse: 書24:13
        quote: The conquest required Israel’s obedience and courage, yet the decisive victory and inheritance came from the Lord (Joshua 21:43–45).
        quoteZh: 爭戰雖需要以色列人的順服與勇氣，決定性的得勝與產業卻是出於耶和華（書21:43-45）。
        line: 414
        evidence: yet the decisive victory and inheritance came from the Lord (Joshua 21:43–45).
  - id: forget-3-jos24-13
    order: 3
    stageLabel: 示劍回顧神所賜的城邑與果園
    refs:
      - 書24:13
    storyCue: gifts
    notes:
      - id: forget-3-bh
        source: BH
        work: BH BibleHub Study
        verse: 書24:13
        quote: Israel entered established Canaanite cities and received homes, wells, and fortified settlements prepared before their arrival, as Moses had foretold (Deuteronomy 6:10–11).
        quoteZh: 正如摩西預先所說的（申6:10-11），以色列人進入已經建好的迦南城邑，得著他們來到之前便已預備好的房屋、水井與堅固居所。
        line: 421
        evidence: prepared before their arrival, as Moses had foretold (Deuteronomy 6:10–11).
  - id: forget-4-jos24-17
    order: 4
    stageLabel: 百姓回答為奴之家領出來的神
    refs:
      - 書24:17
    storyCue: answer-1
    notes:
      - id: forget-4-bh
        source: BH
        work: BH BibleHub Study
        verse: 書24:17
        paraphrase: 在書24:17『為奴之家』下交叉引註申5:6與出13:3。
        line: 574
        evidence: Deu 5:6 I am the LORD your God, who brought you out
  - id: forget-5-jos24-31
    order: 5
    stageLabel: 知道耶和華所行諸事的長老還在的時候
    refs:
      - 書24:31
    storyCue: elders
    notes:
      - id: forget-5-gt-study
        source: GT
        work: GT《約書亞記研經資料(蔡哲民等)》
        verse: 書24:31
        quote: 24：31 也暗示當這些長老死去以後，以色列人就不再專心事奉神了，這正是士師記所描述的混亂狀況。
        line: 415
        evidence: 也暗示當這些長老死去以後，以色列人就不再專心事奉神了
  - id: forget-6-judg2
    order: 6
    stageLabel: 後來有別的世代興起
    refs:
      - 士2:7-10
    storyCue: epilogue-diff
    notes:
      - id: forget-6-bh
        source: BH
        work: BH BibleHub Study
        verse: 書24:31
        quote: When that generation passed away, later Israelites failed to remember the LORD’s works, opening the way for the spiritual decline recorded in Judges.
        quoteZh: 當那一代過去之後，後來的以色列人沒有記念耶和華的作為，開啟了士師記所記載的屬靈衰落。
        line: 1089
        evidence: When that generation passed away, later Israelites failed to remember
      - id: forget-6-kc
        source: KC
        work: KC KingComments
        verse: 書24:31
        quote: When the witnesses of the power of the LORD and its influence on the people are gone, a new generation rises that is open to the influences of the peoples around them. The following book, Judges, shows this.
        quoteZh: 當見證耶和華大能及其影響力的人離去後，新的一代興起，向周圍列族的影響敞開；接下來的士師記就顯明了這事。
        line: 87
        evidence: When the witnesses of the power of the LORD and its influence on the people are gone

beadQuestions:
  work: GT《串珠聖經注釋》【思想問題(第24章)】
  attributionLine: 471
  attributionEvidence: ──《串珠聖經注釋》
  items:
    - number: 1
      text: １ 1節顯示：約書亞給百姓的囑咐都是出於神，因為百姓是站在神面前領受。基督徒對神僕人的教導應有什麽態度？參16節。
      line: 459
      evidence: 1節顯示：約書亞給百姓的囑咐都是出於神，因為百姓是站在神面前領受。
    - number: 2
      text: ２ 假若亞伯拉罕沒有蒙神帶領離開拜偶像的環境(2~3)，你想他的信仰會有任何的改變？人可以在神的救恩上誇口麽？參約15：16。
      line: 461
      evidence: 假若亞伯拉罕沒有蒙神帶領離開拜偶像的環境(2~3)
    - number: 3
      text: ３ 以色列人離開埃及後陸續遇到什麽困難(5~11)？神怎樣施恩給他們，使他們得到應許的迦南地？今日信徒蒙神帶領離開罪惡走永生道路，會有類似的經歷麽？
      line: 463
      evidence: 以色列人離開埃及後陸續遇到什麽困難(5~11)？
    - number: 4
      text: ４ 約書亞不但嚴囑咐百姓敬畏及事奉耶和華，且以身作則，表明他的家只事奉耶和華(15)。今日教導神話語的人，是否也該如此？
      line: 465
      evidence: 約書亞不但嚴囑咐百姓敬畏及事奉耶和華，且以身作則
    - number: 5
      text: ５ 約書亞吩咐百姓要除掉他們中間的外邦神(23)，這有可指住在他們中間的迦南人所信奉的偶像。你周圍不認識神的人拜偶像的風氣有否影響你，妨礙你專一服事神呢？
      line: 467
      evidence: 約書亞吩咐百姓要除掉他們中間的外邦神(23)，這有可指住在他們中間的迦南人所信奉的偶像。
    - number: 6
      text: ６ 31節有什麽含意？參士2：8~13。以色列人容易偏離神，他們的失敗給基督徒什麽警惕？
      line: 469
      evidence: 31節有什麽含意？參士2：8~13。以色列人容易偏離神
