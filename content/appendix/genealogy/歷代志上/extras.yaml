# 歷代志上 1–9 章：人物卡與附表。所有「」引句、對照字串、數字、城名都由 build_genealogy.py 逐字對照所引經節。

# ── 人物卡：只寫經文明說的事，一兩句話；refs 要涵蓋句中所有「」引句 ──
cards:
  - id: 寧錄
    text: 1:10 說「他為世上英雄之首」。創世記說「他國的起頭是巴別、以力、亞甲、甲尼，都在示拿地」。
    refs: "1:10, 創 10:10"
  - id: 亞伯拉罕
    text: 本名亞伯蘭。神對他說：「你的名不再叫亞伯蘭，要叫亞伯拉罕，因為我已立你作多國的父」。
    refs: "1:27, 創 17:5"
  - id: 珥
    text: 猶大的長子，「在耶和華眼中看為惡，耶和華就使他死了」。
    refs: "2:3"
  - id: 亞干
    text: 約書亞時代，「亞干取了當滅的物；耶和華的怒氣就向以色列人發作」。
    refs: "2:7, 書 7:1"
  - id: 波阿斯
    text: 大衛的曾祖父。「波阿斯娶了路得為妻」，生了俄備得。
    refs: "2:11-12, 得 4:13"
  - id: 大衛
    text: 耶西的第七個兒子。「在希伯崙作王七年零六個月，在耶路撒冷作王三十三年」。
    refs: "2:15, 3:4"
  - id: 亞瑪撒
    text: 押沙龍造反時，「押沙龍立亞瑪撒作元帥，代替約押」；後來被約押所殺。
    refs: "2:17, 撒下 17:25, 撒下 20:10"
  - id: 比撒列
    text: 戶珥的孫子、烏利的兒子。造會幕的時候，神說：「猶大支派中，戶珥的孫子、烏利的兒子比撒列，我已經提他的名召他」。
    refs: "2:20, 出 31:2"
  - id: 睚珥
    text: 希斯崙和瑪吉的女兒所生的後代，「在基列地有二十三個城邑」。民數記稱他是「瑪拿西的子孫睚珥」，把那些村莊叫作「哈倭特睚珥」。
    refs: "2:21-22, 民 32:41"
  - id: 亞太
    text: 示珊沒有兒子，「示珊將女兒給了僕人耶哈為妻，給他生了亞太」；這一家從亞太往下又記了十二代。
    refs: "2:34-41"
  - id: 押撒
    text: 2:49「迦勒的女兒是押撒」，這位迦勒是希斯崙的兒子。約書亞記另有耶孚尼的兒子迦勒，也說「我就把我女兒押撒給他為妻」，後來嫁給俄陀聶。經文沒有說這兩位押撒是同一人。
    refs: "2:49, 書 15:16-17"
  - id: 暗嫩
    text: 大衛的長子。後來押沙龍吩咐僕人「殺暗嫩」。
    refs: "3:1, 撒下 13:28"
  - id: 押沙龍
    text: 大衛的三子，母親是基述王的女兒瑪迦。他起來造反，讓人說「押沙龍在希伯崙作王了」，最後被約押「刺透他的心」。
    refs: "3:2, 撒下 15:10, 撒下 18:14"
  - id: 亞多尼雅
    text: 大衛的四子。大衛年老時，他「自尊，說：我必作王」。
    refs: "3:2, 王上 1:5"
  - id: 他瑪
    text: 大衛的女兒，押沙龍的同母妹妹。遭暗嫩玷辱以後，「他瑪就孤孤單單地住在他胞兄押沙龍家裡」。
    refs: "3:9, 撒下 13:20"
  - id: 拿單
    text: 大衛和拔書亞的兒子。路加福音的家譜經過他：「拿單是大衛的兒子」。
    refs: "3:5, 路 3:31"
  - id: 所羅門
    text: 大衛和拔書亞的兒子，接續作王；在「作以色列王第四年」開工建造耶和華的殿。
    refs: "3:5, 3:10, 王上 6:1"
  - id: 約西亞
    text: 「約西亞登基的時候年八歲，在耶路撒冷作王三十一年」。他的四個兒子中有三個先後作王。
    refs: "3:14-15, 代下 34:1"
  - id: 耶哥尼雅
    text: 也叫約雅斤。3:17 說「耶哥尼雅被擄」；被擄三十七年後，巴比倫王「使猶大王約雅斤抬頭，提他出監」。
    refs: "3:16-17, 王下 25:27"
  - id: 所羅巴伯
    text: 被擄歸回的領袖。以斯拉記記他和祭司耶書亞「都起來建築以色列神的壇」。
    refs: "3:19, 拉 3:2"
  - id: 哈突
    text: 示瑪雅的兒子。以斯拉記 8:2 列在隨以斯拉回來的人中：「屬大衛的子孫有哈突」；經文沒有說這兩處的哈突是不是同一人。
    refs: "3:22, 拉 8:2"
  - id: 雅比斯
    text: 母親給他取名雅比斯，意思是「我生他甚是痛苦」。他禱告說：「甚願你賜福與我，擴張我的境界，常與我同在，保佑我不遭患難，不受艱苦」，「神就應允他所求的」。
    refs: "4:9-10"
  - id: 俄陀聶
    text: 以色列人呼求耶和華，神興起的拯救者就是「迦勒兄弟基納斯的兒子俄陀聶」；之後「國中太平四十年」。
    refs: "4:13, 士 3:9, 士 3:11"
  - id: 迦勒#耶孚尼
    text: 約書亞時代的探子。「約書亞為耶孚尼的兒子迦勒祝福，將希伯崙給他為業」。這位迦勒和 2:18 起的迦勒（基路拜，希斯崙的兒子）不同人。
    refs: "4:15, 書 14:13"
  - id: 米列
    text: 4:17：「米列娶法老女兒比提雅為妻」，又娶了一位猶大女子。
    refs: "4:17"
  - id: 示每#撒刻
    text: 「示每有十六個兒子，六個女兒」，但他的弟兄兒女不多。
    refs: "4:27"
  - id: 備拉
    text: 流便支派的首領，「被亞述王提革拉毘尼色擄去」。
    refs: "5:6"
  - id: 亞倫
    text: 他和子孫「在燔祭壇和香壇上獻祭燒香，又在至聖所辦理一切的事，為以色列人贖罪」。
    refs: "6:3, 6:49"
  - id: 非尼哈
    text: 亞倫的孫子。神說他「使我向以色列人所發的怒消了」；9:20 記「從前以利亞撒的兒子非尼哈管理他們，耶和華也與他同在」。
    refs: "6:4, 民 25:11, 9:20"
  - id: 撒督
    text: 大衛和所羅門時的祭司。「祭司撒督就從帳幕中取了盛膏油的角來，用膏膏所羅門」。
    refs: "6:8, 王上 1:39"
  - id: 希勒家
    text: 約西亞時的大祭司，他說：「我在耶和華殿裡得了律法書」。
    refs: "6:13, 王下 22:8"
  - id: 西萊雅
    text: 耶路撒冷陷落時，「護衛長拿住大祭司西萊雅」，帶到利比拉擊殺。
    refs: "6:14, 王下 25:18, 王下 25:21"
  - id: 撒母耳
    text: 以利加拿的兒子。「哈拿就懷孕。日期滿足，生了一個兒子，給他起名叫撒母耳」。他的長子約珥，就是歌唱領袖希幔的父親。
    refs: "6:27-28, 6:33, 撒上 1:20"
  - id: 可拉
    text: 民數記 16:1 的可拉是「以斯哈的兒子」，帶頭反對摩西；但「可拉的眾子沒有死亡」，他的後代後來成了聖殿的歌唱者和守門人（6:33–37、9:19）。
    refs: "6:37-38, 民 16:1, 民 26:11, 9:19"
  - id: 希幔
    text: 大衛派定的歌唱領袖。「希幔奉神之命作王的先見。神賜給希幔十四個兒子，三個女兒」。
    refs: "6:33, 代上 25:5"
  - id: 亞薩
    text: 歌唱領袖，「在希幔右邊供職」。約櫃進城時，「惟有亞薩敲鈸，大發響聲」。詩篇 50 篇標題是「亞薩的詩」。
    refs: "6:39, 代上 16:5, 詩 50:1"
  - id: 以探
    text: 米拉利族的歌唱領袖，在左邊供職。大衛「派歌唱的希幔、亞薩、以探敲銅鈸，大發響聲」。
    refs: "6:44, 代上 15:19"
  - id: 西羅非哈
    text: 7:15：「西羅非哈但有幾個女兒」。民數記記下她們的名字：「瑪拉、挪阿、曷拉、密迦、得撒」。
    refs: "7:15, 民 27:1"
  - id: 亞比以謝
    text: 基列的妹妹哈摩利吉的兒子。士師基甸的父親約阿施是「亞比以謝族人」。
    refs: "7:18, 士 6:11"
  - id: 舍伊拉
    text: 以法蓮的女兒，經文記她「建築上伯和崙、下伯和崙與烏羨舍伊拉」。
    refs: "7:24"
  - id: 以利沙瑪
    text: 約書亞的祖父。民數記 1:10 記他是曠野時以法蓮的首領：「屬以法蓮的，有亞米忽的兒子以利沙瑪」。
    refs: "7:26, 民 1:10"
  - id: 約書亞
    text: 嫩的兒子。摩西死後，神對他說：「現在你要起來，和眾百姓過這約但河」。
    refs: "7:27, 書 1:2"
  - id: 掃羅
    text: 以色列第一個王。基利波山一役，「掃羅和他三個兒子，與拿他兵器的人，以及跟隨他的人，都一同死亡」。
    refs: "8:33, 撒上 31:6"
  - id: 約拿單
    text: 掃羅的兒子。「約拿單愛大衛，如同愛自己的性命」。
    refs: "8:33, 撒上 18:1"
  - id: 米力巴力
    text: 撒母耳記作米非波設。五歲時乳母抱著他逃跑，「孩子掉在地上，腿就瘸了」；大衛對他說「你也可以常與我同席吃飯」。
    refs: "8:34, 撒下 4:4, 撒下 9:7"
  - id: 伊施巴力
    text: 撒母耳記作伊施波設。掃羅死後，「掃羅的兒子伊施波設登基的時候年四十歲，作以色列王二年」。
    refs: "8:33, 撒下 2:10"
  - id: 沙龍
    text: 歸回後守門人的首領，「可拉的曾孫、以比雅撒的孫子、可利的兒子」。
    refs: "9:17, 9:19"

