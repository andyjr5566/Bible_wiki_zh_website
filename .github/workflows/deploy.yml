name: Deploy Quartz to GitHub Pages

"on":
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "quartz/**"
      - "plugins/**"
      - "quartz.ts"
      - "quartz.config.yaml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Quartz build cache
        uses: actions/cache@v4
        with:
          path: |
            .quartz-cache
            .quartz
          key: quartz-build-${{ hashFiles('quartz.config.yaml', 'plugins/**', 'quartz/**') }}
          restore-keys: |
            quartz-build-

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages base URL
        run: |
          sed -i 's|baseUrl: bible-wiki-zh-website.vercel.app|baseUrl: andyjr5566.github.io/Bible_wiki_zh_website|' quartz.config.yaml

      - name: Setup local plugins
        run: |
          mkdir -p .quartz/plugins
          rm -rf .quartz/plugins/wiki-tour .quartz/plugins/semantic-search .quartz/plugins/graph
          ln -s ../../plugins/wiki-tour .quartz/plugins/wiki-tour
          ln -s ../../plugins/semantic-search .quartz/plugins/semantic-search
          ln -s ../../plugins/graph .quartz/plugins/graph

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Build interactive websites
        run: |
          python quartz/static/website/build.py --ci-build > build_interactive.log 2>&1 || {
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add build_interactive.log
            git commit -m "chore: upload build log"
            git push origin HEAD
            exit 1
          }

      - name: Build Quartz
        run: npx quartz build

      - name: Copy interactive website dist to public
        run: |
          find quartz/static/website -type d -name "dist" | while read dist_dir; do
            dest_dir="public/${dist_dir#quartz/}"
            mkdir -p "$(dirname "$dest_dir")"
            cp -r "$dist_dir" "$(dirname "$dest_dir")/"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
