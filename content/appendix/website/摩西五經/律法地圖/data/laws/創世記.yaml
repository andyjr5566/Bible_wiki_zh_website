    sections:
      - id: gen17-s1
        title: 男子都要受割禮
        verses: 9-14
        laws:
          - id: gen17-09
            title: 男子都要受割禮，生下來第八日，作永遠的約
            refs: ["9-14"]
            entries: [割禮作為立約記號]
            topics: [body-discharge]
            summary: 你們所有的男子都要受割禮，這是神與亞伯拉罕和他後裔所立約的證據；世世代代的男子，家裡生的或用銀子買的，生下來第八日都要受割禮；不受割禮的男子必從民中剪除，因他背了神的約。
            basis: [10, 11, 12, 14]
            why: [11]
