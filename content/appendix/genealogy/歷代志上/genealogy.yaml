      children: [亞斯利干, 波基路, 以實瑪利#亞悉, 示亞利雅, 俄巴底雅, 哈難]
    - ref: "8:37, 8:39"
      parent: 以利亞薩
      parent_in_text: true
      children: [{id: 以設, pnote: 經文作「亞悉兄弟以設」}]
    - ref: "8:39"
