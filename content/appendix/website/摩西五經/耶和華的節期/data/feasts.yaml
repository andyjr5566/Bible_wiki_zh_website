        ref: 賽1:13-14
        note: 月朔、安息日、嚴肅會都是律法定的日子，這裡神卻說憎惡、恨惡。經文自己給了原因：「作罪孽，又守嚴肅會」，下一節又說「你們的手都滿了殺人的血」（賽1:15）。

