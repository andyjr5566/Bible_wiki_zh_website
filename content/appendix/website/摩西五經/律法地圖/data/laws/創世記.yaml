    sections:
      - id: gen02-s1
        title: 神在第七日歇了工
        verses: 2-24
        laws:
          - id: gen02-02
            title: 神在第七日歇了工，賜福給第七日，定為聖日
            refs: ["2-3"]
            topics: [sabbath]
            summary: 到第七日，神造物的工已經完畢，就歇了工；神賜福給第七日，定為聖日，因他在這日歇了創造的工。
            basis: [2, 3]
            why: [3]
          - id: gen02-24
            title: 人要離開父母，與妻子連合，二人成為一體
            refs: ["24"]
            topics: [marriage]
            summary: 人要離開父母，與妻子連合，二人成為一體。
            basis: [24]
            why: [24]
