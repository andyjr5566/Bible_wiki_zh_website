  kings_refs: "王下 15:30, 王下 17:1-6"
  prose:
    text: 何細亞是以拉的兒子，殺了比加篡位，作王九年。他先歸服亞述、向亞述進貢，後來背叛，差人去見埃及王梭。亞述王把他鎖禁、囚在監裡，圍攻撒瑪利亞三年，在何細亞第九年攻取撒瑪利亞，把以色列人擄到亞述。
    refs: "王下 15:30, 王下 17:1-6, 王下 18:9-11"
