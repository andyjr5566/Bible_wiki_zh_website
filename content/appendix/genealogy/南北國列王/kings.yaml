  verdict:
    class: bad
    basis: 王上
    items:
      - {book: 王上, role: 評語, quote: 他行耶和華眼中看為惡的事, ref: "王上 22:52"}
  synchronism:
    - {quote: 猶大王約沙法十七年，亞哈的兒子亞哈謝在撒瑪利亞登基, ref: "王上 22:51"}
  kings_refs: "王上 22:51-53, 王下 1:1-18"
  chronicles_refs: "代下 20:35-37"
  prose:
    text: 亞哈謝是亞哈的兒子，作王二年。他從樓上的欄杆掉下來，打發人去問以革倫的神巴力西卜；以利亞攔住使者，說他必定要死。他果然死了，沒有兒子，由兄弟約蘭接續作王。歷代志記約沙法和他合夥造船，船後來破壞了。
    refs: "王上 22:51-53, 王下 1:1-18, 代下 20:35-37"

- id: 約蘭#以色列
  name: 約蘭
  title: 約蘭（以色列）
  kingdom: 以色列
  years: {start: 852, end: 841}
  verdict:
    class: bad
    basis: 王下
    items:
      - {book: 王下, role: 評語, quote: 他行耶和華眼中看為惡的事, ref: "王下 3:2"}
      - {book: 王下, role: 但書, quote: 但不致像他父母所行的, ref: "王下 3:2"}
  synchronism:
    - {quote: 猶大王約沙法十八年，亞哈的兒子約蘭在撒瑪利亞登基作了以色列王, ref: "王下 3:1"}
  kings_refs: "王下 3:1-9:26"
  chronicles_refs: "代下 22:5-7"
  prose:
    text: 約蘭是亞哈的兒子，作王十二年。他除掉他父親所造巴力的柱像。他聯合猶大王約沙法和以東王攻打摩押，軍中缺水時，以利沙為他們傳耶和華的話。他和亞蘭王哈薛打仗受了傷，在耶斯列養傷時，被耶戶射死，屍首拋在耶斯列人拿伯的田間。
    refs: "王下 3:1-27, 王下 8:28-9:26, 代下 22:5-7"

- id: 耶戶
  name: 耶戶
  kingdom: 以色列
  years: {start: 841, end: 814}
  verdict:
    class: good_caveat
    basis: 王下
    items:
      - {book: 王下, role: 評語, quote: 因你辦好我眼中看為正的事, ref: "王下 10:30"}
      - {book: 王下, role: 但書, quote: 只是耶戶不盡心遵守耶和華─以色列神的律法, ref: "王下 10:31"}
  kings_refs: "王下 9:1-10:36"
  chronicles_refs: "代下 22:7-9"
  prose:
    text: 耶戶是寧示的孫子，原是軍長。以利沙差一個門徒去膏他作王，吩咐他剿滅亞哈家。他射死以色列王約蘭，也殺了猶大王亞哈謝和耶洗別，又設計殺盡拜巴力的人。耶和華說他「辦好我眼中看為正的事」，應許他的子孫坐國位直到四代；但他仍不離開伯特利和但的金牛犢。他作王二十八年。
    refs: "王下 9:1-10:36, 代下 22:7-9"

- id: 約哈斯#以色列
