shechemArchaeology:
  title: 這座城本身
  points:
    - 巴拉塔遺址支配基利心山與以巴路山之間的山隘與商道，從銅石器時代到希臘時代共有二十四個文化層。
    - 中銅器時代興建了巨大的護堤與廟宇；晚銅器時代重建，亞馬拿文獻提到當地君王拉布阿尤以示劍為根據地。
    - 遺址的鐵器時代沒有毀滅層，約書亞攻取城市名單（書12:7-23）也沒有包括示劍，以色列人可能未經重大爭戰便取得這城控制權。
  sourceNote:
    id: shechem-arch-walton
    source: GT
    work: GT 華爾頓《約書亞記背景注釋》
    verse: 書24:1
    quote: 其考古史從銅石器時代起，到希臘時代為止，一共包括了二十四個文化層。
    line: 26
    evidence: 其考古史從銅石器時代起，到希臘時代為止，一共包括了二十四個文化層。

