    ot:
      - kind: kept
        ref: 拉3:6
        note: 七月初一，就是利23:24 吹角的那一天。被擄歸回的人還沒有聖殿，連殿的根基都還沒立，先在原有的根基上築壇（拉3:3），從這一天起向耶和華獻燔祭。
      - kind: kept
        ref: 詩81:3-4
        note: 詩人要人在月朔和月望（月圓的日子）吹角，理由是「這是為以色列定的律例」。這裡的「角」，STEP 譯為 a ram's horn（公羊角）；利23:24 的「吹角」原文只說響亮的聲音，沒有說用什麼吹。
      - kind: word
        ref: 珥2:1
        note: 和合本同樣譯作「吹角」，原文卻不同字：利23:24 只說響亮的聲音，這裡明說吹公羊角，「吹出大聲」STEP 譯為 sound a battle signal（發出戰爭的信號）。本段沒有交代月日，吹角是警告耶和華的日子臨近。
      - kind: word
        ref: 珥2:15-17
        note: 「嚴肅會」原文和利23:36 同字，「吹角」則和利23:24 不同字。這裡召的是禁食的聚會：前面說要「禁食、哭泣、悲哀，一心歸向我」（珥2:12），連新郎新婦都要出來，祭司在廊子和祭壇中間哭求。
