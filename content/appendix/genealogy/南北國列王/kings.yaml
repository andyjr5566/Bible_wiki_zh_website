# 南北國君王登錄檔（唯一來源）：歷代志下列王頁的卡片、南北國列王對照頁、總覽頁共用。
#
# verdict.class：good ●行正／good_caveat ●但 行正另有但書／good_to_bad ◐好轉壞／bad_to_good ◑壞轉好／bad ○行惡／none —沒有評語
# verdict.items：role 只能是 評語／但書／轉變；quote 必須逐字出現在 ref。
# differs：統一王國與猶大的王，兩卷（撒母耳記或列王紀 vs 歷代志）一卷有評語另一卷沒有、或一卷多寫了轉變時為 true。北國的王不標。
# prose：事蹟散文，只寫所附經節裡有的事；「」內逐字。

chronology:
  label: Thiele 年表
  source: 'Edwin R. Thiele, The Mysterious Numbers of the Hebrew Kings（新修訂版／第三版，Zondervan 1983），附錄 B「The Dates of the Kings of Israel and Judah」第 217 頁；共治與並立見第 219 頁。本頁數字轉錄自英文維基百科 List of kings of Judah 與 List of kings of Israel 的 Thiele 欄（https://en.wikipedia.org/wiki/List_of_kings_of_Judah 、https://en.wikipedia.org/wiki/List_of_kings_of_Israel ），並參照 Thiele 1974 年 JBL 文章與 McFall 1991、Young 2007 的轉載核對；何細亞的結束年作 723。原書表格未能逐格目驗。'
  estimate_source: '掃羅、大衛、所羅門不在 Thiele 年表內。大衛、所羅門採英文維基百科 Kings of Israel and Judah 表格 Galil、Kitchen 欄的 1010–970、970–931（https://en.wikipedia.org/wiki/Kings_of_Israel_and_Judah ）；掃羅依使徒行傳 13:21 的四十年，接在大衛之前倒推作 1050–1010。'
  note: 年代不是經文本身的資料。經文只記「某王第幾年，某某登基」和在位年數，各家年表的換算不同；圖上的數字一律是「約」。

kings:
# ───────────── 統一王國 ─────────────
- id: 掃羅
  name: 掃羅
  kingdom: 統一
  years: {start: 1050, end: 1010, estimate: true}
  verdict:
    class: bad
    basis: 代上
    differs: false
    items:
      - {book: 代上, role: 評語, quote: 因為他干犯耶和華，沒有遵守耶和華的命, ref: "代上 10:13"}
      - {book: 撒上, role: 評語, quote: 你既厭棄耶和華的命令，耶和華也厭棄你作王, ref: "撒上 15:23"}
  kings_refs: "撒上 9:1-31:13"
  chronicles_refs: "代上 10:1-14"
  prose:
    text: 掃羅是便雅憫人基士的兒子，撒母耳膏他作以色列的第一個王。他後來違背耶和華藉撒母耳傳的命令，撒母耳對他說「耶和華也厭棄你作王」。他多年追殺大衛，最後和三個兒子死在基利波山。歷代志說他死，是「因為他干犯耶和華，沒有遵守耶和華的命」，又「求問交鬼的婦人」。
    refs: "撒上 9:1-2, 撒上 10:1, 撒上 15:23, 代上 10:1-14"
  notes:
    - text: 和合本撒上 13:1 說掃羅「作以色列王二年的時候」，使徒行傳 13:21 說神將掃羅「給他們作王四十年」。圖上的年代用四十年推估。
      refs: "撒上 13:1, 徒 13:21"

- id: 大衛
  name: 大衛
  kingdom: 統一
  years: {start: 1010, end: 970, estimate: true}
  verdict:
    class: good_caveat
    basis: 王上
    differs: true
    items:
      - {book: 王上, role: 評語, quote: 都是行耶和華眼中看為正的事, ref: "王上 15:5"}
      - {book: 王上, role: 但書, quote: 除了赫人烏利亞那件事, ref: "王上 15:5"}
  kings_refs: "撒上 16:1-31:13, 撒下 1:1-24:25, 王上 1:1-2:11"
  chronicles_refs: "代上 11:1-29:30"
  prose:
    text: 大衛是耶西的第七個兒子，在希伯崙作猶大王七年半，又在耶路撒冷作以色列眾人的王三十三年。他攻取錫安的保障，把約櫃運進大衛城，打敗四圍的仇敵。神藉先知拿單應許「必為你建立家室」。撒母耳記下記了他和拔示巴的事、押沙龍的叛亂；歷代志沒有記這兩件事，卻用很長的篇幅寫他為建殿預備材料，安排祭司和利未人的班次。
    refs: "代上 2:15, 撒下 5:4-5, 代上 11:5, 代上 15:25-29, 代上 17:10, 撒下 11:1-27, 撒下 15:1-18:33, 代上 22:1-29:30"

- id: 所羅門
  name: 所羅門
  kingdom: 統一
  years: {start: 970, end: 931, estimate: true}
  verdict:
    class: good_to_bad
    basis: 王上
    differs: true
    items:
      - {book: 王上, role: 評語, quote: 所羅門愛耶和華，遵行他父親大衛的律例, ref: "王上 3:3"}
      - {book: 王上, role: 但書, quote: 只是還在邱壇獻祭燒香, ref: "王上 3:3"}
      - {book: 王上, role: 轉變, quote: 所羅門年老的時候，他的妃嬪誘惑他的心去隨從別神, ref: "王上 11:4"}
      - {book: 王上, role: 評語, quote: 所羅門行耶和華眼中看為惡的事, ref: "王上 11:6"}
  kings_refs: "王上 1:1-11:43"
  chronicles_refs: "代下 1:1-9:31"
  prose:
    text: 所羅門是大衛和拔示巴的兒子，接續大衛作王四十年。他向神求智慧，在作王第四年開工建造耶和華的殿，建了七年。列王紀說他年老的時候，「他的妃嬪誘惑他的心去隨從別神」，耶和華因此說要把國奪去，只留一個支派給他的兒子。歷代志記了他建殿、奉獻聖殿和示巴女王來訪，沒有記他晚年的事。
    refs: "代上 3:5, 王上 3:5-14, 王上 6:1, 王上 6:38, 王上 11:1-13, 王上 11:42, 代下 1:1-9:31"

# ───────────── 南國猶大 ─────────────
- id: 羅波安
  name: 羅波安
  kingdom: 猶大
  years: {start: 931, end: 913}
  verdict:
    class: good_to_bad
    basis: 代下
    differs: true
    items:
      - {book: 代下, role: 轉變, quote: 羅波安的國堅立，他強盛的時候就離棄耶和華的律法, ref: "代下 12:1"}
      - {book: 代下, role: 轉變, quote: 王自卑的時候，耶和華的怒氣就轉消了, ref: "代下 12:12"}
      - {book: 代下, role: 評語, quote: 羅波安行惡，因他不立定心意尋求耶和華, ref: "代下 12:14"}
  kings_refs: "王上 12:1-24, 王上 14:21-31"
  chronicles_refs: "代下 10:1-12:16"
  prose:
    text: 羅波安是所羅門的兒子，母親是亞捫人拿瑪。他不聽老年人的勸告，用嚴厲的話回答百姓，北方的支派就離開他，立耶羅波安作王。歷代志說他國位堅固以後「就離棄耶和華的律法」；埃及王示撒攻打耶路撒冷，先知示瑪雅傳話，他和首領就自卑。他在耶路撒冷作王十七年。
    refs: "代下 10:1-12:16, 王上 12:1-20, 王上 14:21-31"

- id: 亞比雅
  name: 亞比雅
  kingdom: 猶大
  years: {start: 913, end: 911}
  verdict:
    class: bad
    basis: 王上
    differs: true
    items:
      - {book: 王上, role: 評語, quote: 亞比央行他父親在他以前所行的一切惡, ref: "王上 15:3"}
  synchronism:
    - {quote: 尼八的兒子耶羅波安王十八年，亞比央登基作猶大王, ref: "王上 15:1"}
  kings_refs: "王上 15:1-8"
  chronicles_refs: "代下 13:1-22"
  prose:
    text: 亞比雅（列王紀作亞比央）是羅波安的兒子，在耶路撒冷作王三年。列王紀說他「行他父親在他以前所行的一切惡」。歷代志沒有這句評語，卻記他在洗瑪臉山上向耶羅波安和以色列人喊話，說猶大有亞倫的子孫作祭司；接著猶大人「因倚靠耶和華」打敗了以色列。
    refs: "王上 15:1-8, 代下 13:1-22"

- id: 亞撒
  name: 亞撒
  kingdom: 猶大
  years: {start: 911, end: 870}
  verdict:
    class: good_to_bad
    basis: 代下
    differs: true
    items:
      - {book: 王上, role: 評語, quote: 亞撒效法他祖大衛行耶和華眼中看為正的事, ref: "王上 15:11"}
      - {book: 王上, role: 但書, quote: 只是邱壇還沒有廢去, ref: "王上 15:14"}
      - {book: 代下, role: 評語, quote: 亞撒行耶和華─他神眼中看為善為正的事, ref: "代下 14:2"}
      - {book: 代下, role: 轉變, quote: 因你仰賴亞蘭王，沒有仰賴耶和華─你的神, ref: "代下 16:7"}
      - {book: 代下, role: 轉變, quote: 病的時候沒有求耶和華，只求醫生, ref: "代下 16:12"}
  synchronism:
    - {quote: 以色列王耶羅波安二十年，亞撒登基作猶大王, ref: "王上 15:9"}
  kings_refs: "王上 15:9-24"
  chronicles_refs: "代下 14:1-16:14"
  prose:
    text: 亞撒是亞比雅的兒子，作王四十一年。他除掉外邦的祭壇和偶像，又因祖母瑪迦造了可憎的偶像，就貶了他太后的位。古實人謝拉來攻擊時，他呼求耶和華而得勝。後來以色列王巴沙來攻，他拿聖殿和王宮的金銀送給亞蘭王便哈達求助，先見哈拿尼責備他，他就把先見囚在監裡。晚年他腳上有病，「病的時候沒有求耶和華，只求醫生」。
    refs: "代下 14:1-16:14, 王上 15:9-24"

- id: 約沙法
  name: 約沙法
  kingdom: 猶大
  years: {start: 870, end: 848, co_start: 872}
  verdict:
    class: good_caveat
    basis: 代下
    differs: false
    items:
      - {book: 王上, role: 評語, quote: 行耶和華眼中看為正的事, ref: "王上 22:43"}
      - {book: 王上, role: 但書, quote: 只是邱壇還沒有廢去, ref: "王上 22:43"}
      - {book: 代下, role: 評語, quote: 行耶和華眼中看為正的事, ref: "代下 20:32"}
      - {book: 代下, role: 但書, quote: 只是邱壇還沒有廢去, ref: "代下 20:33"}
  synchronism:
    - {quote: 以色列王亞哈第四年，亞撒的兒子約沙法登基作了猶大王, ref: "王上 22:41"}
  kings_refs: "王上 22:41-50"
  chronicles_refs: "代下 17:1-20:37"
  prose:
    text: 約沙法是亞撒的兒子，三十五歲登基，在耶路撒冷作王二十五年。他差派首領和利未人帶著律法書，到猶大各城教訓百姓，又在各城設立審判官。他與亞哈結親，和亞哈一同上基列的拉末打仗；回來以後先見耶戶責備他，也說「你還有善行」。摩押人和亞捫人來攻的時候，他宣告禁食，敵軍後來彼此自相擊殺。
    refs: "代下 17:1-20:37, 王上 22:41-50"

- id: 約蘭#猶大
  name: 約蘭
  title: 約蘭（猶大）
  kingdom: 猶大
  years: {start: 848, end: 841, co_start: 853}
  verdict:
    class: bad
    basis: 代下
    differs: false
    items:
      - {book: 王下, role: 評語, quote: 行耶和華眼中看為惡的事, ref: "王下 8:18"}
      - {book: 代下, role: 評語, quote: 行耶和華眼中看為惡的事, ref: "代下 21:6"}
  synchronism:
    - {quote: 以色列王亞哈的兒子約蘭第五年，猶大王約沙法還在位的時候，約沙法的兒子約蘭登基作了猶大王, ref: "王下 8:16"}
  kings_refs: "王下 8:16-24"
  chronicles_refs: "代下 21:1-20"
  prose:
    text: 約蘭是約沙法的兒子，娶了亞哈的女兒為妻。他登基以後殺了自己的眾兄弟。以東和立拿在他的時候背叛猶大。先知以利亞寫信給他，說耶和華要使他患腸病；後來他「腸子墜落」而死，經文說「他去世無人思慕」。
    refs: "代下 21:1-20, 王下 8:16-24"

- id: 亞哈謝#猶大
  name: 亞哈謝
  title: 亞哈謝（猶大）
  kingdom: 猶大
  years: {start: 841, end: 841}
  verdict:
    class: bad
    basis: 代下
    differs: false
    items:
      - {book: 王下, role: 評語, quote: 亞哈謝效法亞哈家行耶和華眼中看為惡的事, ref: "王下 8:27"}
      - {book: 代下, role: 評語, quote: 他行耶和華眼中看為惡的事，像亞哈家一樣, ref: "代下 22:4"}
  synchronism:
    - {quote: 以色列王亞哈的兒子約蘭十二年，猶大王約蘭的兒子亞哈謝登基, ref: "王下 8:25"}
  kings_refs: "王下 8:25-29, 王下 9:27-29"
  chronicles_refs: "代下 22:1-9"
  prose:
    text: 亞哈謝是約蘭的兒子，母親是暗利的孫女亞他利雅。歷代志說「他母親給他主謀，使他行惡」。他和以色列王約蘭一同去攻打亞蘭王哈薛，後來去探望受傷的約蘭，正遇上耶戶剿滅亞哈家，就被殺了。他只作王一年。
    refs: "代下 22:1-9, 王下 8:25-29, 王下 9:27-29"

- id: 亞他利雅
  name: 亞他利雅
  kingdom: 猶大
  years: {start: 841, end: 835}
  verdict:
    class: none
    differs: false
    items: []
  kings_refs: "王下 11:1-20"
  chronicles_refs: "代下 22:10-23:21"
  prose:
    text: 亞他利雅是亞哈謝的母親。他見兒子死了，「就起來剿滅猶大王室」，自己治理國事六年。亞哈謝的妹妹約示巴把小約阿施偷出來，藏在神殿裡。第七年祭司耶何耶大立約阿施作王，眾人殺了亞他利雅。兩卷都沒有對他的評語句。
    refs: "代下 22:10-23:21, 王下 11:1-20"

- id: 約阿施#猶大
  name: 約阿施
  title: 約阿施（猶大）
  kingdom: 猶大
  years: {start: 835, end: 796}
  verdict:
    class: good_to_bad
    basis: 代下
    differs: true
    items:
      - {book: 王下, role: 評語, quote: 就行耶和華眼中看為正的事, ref: "王下 12:2"}
      - {book: 王下, role: 但書, quote: 只是邱壇還沒有廢去, ref: "王下 12:3"}
      - {book: 代下, role: 評語, quote: 約阿施行耶和華眼中看為正的事, ref: "代下 24:2"}
      - {book: 代下, role: 轉變, quote: 耶何耶大死後，猶大的眾首領來朝拜王；王就聽從他們, ref: "代下 24:17"}
  synchronism:
    - {quote: 耶戶第七年，約阿施登基, ref: "王下 12:1"}
  kings_refs: "王下 11:21-12:21"
  chronicles_refs: "代下 24:1-27"
  prose:
    text: 約阿施七歲登基，在耶路撒冷作王四十年。祭司耶何耶大在世的時候，他行正，並且重修耶和華的殿。耶何耶大死後，他聽從眾首領，百姓去事奉亞舍拉和偶像。耶何耶大的兒子撒迦利雅責備他們，約阿施竟吩咐人在殿院裡用石頭打死他。後來臣僕背叛他，把他殺在床上，「只是不葬在列王的墳墓裡」。
    refs: "代下 24:1-27, 王下 12:1-21"

- id: 亞瑪謝
  name: 亞瑪謝
  kingdom: 猶大
  years: {start: 796, end: 767}
  verdict:
    class: good_to_bad
    basis: 代下
    differs: true
    items:
      - {book: 王下, role: 評語, quote: 亞瑪謝行耶和華眼中看為正的事, ref: "王下 14:3"}
      - {book: 王下, role: 但書, quote: 但不如他祖大衛, ref: "王下 14:3"}
      - {book: 代下, role: 評語, quote: 亞瑪謝行耶和華眼中看為正的事, ref: "代下 25:2"}
      - {book: 代下, role: 但書, quote: 只是心不專誠, ref: "代下 25:2"}
      - {book: 代下, role: 轉變, quote: 亞瑪謝殺了以東人回來，就把西珥的神像帶回, ref: "代下 25:14"}
  synchronism:
    - {quote: 以色列王約哈斯的兒子約阿施第二年，猶大王約阿施的兒子亞瑪謝登基, ref: "王下 14:1"}
  kings_refs: "王下 14:1-20"
  chronicles_refs: "代下 25:1-28"
  prose:
    text: 亞瑪謝是約阿施的兒子。他登基後殺了殺害他父親的臣僕，卻照摩西律法沒有殺他們的兒子。他在鹽谷打敗以東，回來卻把西珥的神像帶回，「立為自己的神」。他向以色列王約阿施挑戰，在伯示麥大敗被擒。後來耶路撒冷有人背叛他，他逃到拉吉，在那裡被殺。
    refs: "代下 25:1-28, 王下 14:1-20"

