# 利未記26–27 章（祝福與咒詛不收；許願與奉獻、十分之一）。
book: 利未記
chapters:
  - chapter: 26
    excluded:
      - { verses: "3-13", reason: 遵行律例之後的祝福與應許 }
      - { verses: "14-45", reason: 不遵行律例的懲罰、地的安息，以及認罪悔改後立約的應許 }
      - { verses: "46", reason: 這些律例典章的結語 }
    sections:
      - id: lev26-s1
        title: 兩條前提
        verses: 1-2
        laws:
          - id: lev26-01
            title: 不可做神像、偶像和柱像，要守安息日、敬聖所
            refs: ["1-2"]
            topics: [sabbath, idolatry]
            summary: 你們不可做什麼虛無的神像，不可立雕刻的偶像或是柱像，也不可在你們的地上安什麼鏨成的石像，向它跪拜；你們要守我的安息日，敬我的聖所。
            basis: [1, 2]
            why: [1]
  - chapter: 27
    excluded:
      - { verses: "1", reason: 耶和華對摩西說話的引言 }
      - { verses: "34", reason: 這些命令的結語 }
    sections:
      - id: lev27-s1
        title: 人與牲畜的許願
        verses: 2-13
        laws:
          - id: lev27-02
            title: 還特許的願，按人的年歲估價歸給耶和華
            refs: ["2-8"]
            topics: [vows]
            summary: 人還特許的願，被許的人要按所估的價值歸給耶和華：從二十歲到六十歲的男人估五十舍客勒，女人三十舍客勒；年歲不同，估價也不同；貧窮不能照所估的價，要帶到祭司面前，按許願人的力量估定。
            basis: [2, 3, 4, 8]
          - id: lev27-09
            title: 許的是牲畜，要成為聖，不可更換
            refs: ["9-13"]
            topics: [vows, offerings]
            summary: 所許的若是獻給耶和華為供物的牲畜，都要成為聖，不可改換或更換；若以牲畜更換牲畜，兩隻都要成為聖；不潔淨的牲畜由祭司估價，要贖回就加上五分之一。
            basis: [9, 10, 11, 12, 13]
      - id: lev27-s2
        title: 房屋與田地的奉獻
        verses: 14-25
        laws:
          - id: lev27-14
            title: 把房屋分別為聖歸給耶和華，贖回要加五分之一
            refs: ["14-15"]
            topics: [vows]
            summary: 人將房屋分別為聖，歸給耶和華，祭司就要估定價值；分別為聖的人若要贖回，就要在所估的價值以外加上五分之一，房屋仍舊歸他。
            basis: [14, 15]
          - id: lev27-16
            title: 把承受為業的地分別為聖，依禧年的年數估價
            refs: ["16-21"]
            topics: [vows, sabbath-year, inheritance]
            summary: 人將承受為業的幾分地分別為聖，要按這地撒種多少估價；禧年以後分別的，按所剩的年數推算；要贖回就加上五分之一；不贖回而賣給別人，就再不能贖，到了禧年那地歸耶和華為聖，歸祭司為業。
            basis: [16, 17, 18, 19, 20, 21]
            entries: [禧年（第五十年）, 禧年土地贖回計算法（按距禧年年數定價）]
          - id: lev27-22
            title: 把買來的地分別為聖，推算到禧年，禧年歸原主
            refs: ["22-25"]
            topics: [vows, sabbath-year, inheritance]
            summary: 將所買的、不是承受為業的一塊地分別為聖歸給耶和華，祭司要給他推算價值到禧年，他當日以所估的價銀為聖；到了禧年，那地歸賣主，就是原來承受為業的人；估價都按聖所的平。
            basis: [22, 23, 24, 25]
            entries: [禧年（第五十年）, 禧年土地贖回計算法（按距禧年年數定價）]
      - id: lev27-s3
        title: 不可再分別的與永獻的
        verses: 26-29
        laws:
          - id: lev27-26
            title: 頭生的牲畜已歸耶和華，不可再分別為聖
            refs: ["26-27"]
            topics: [firstborn, vows]
            summary: 牲畜中頭生的，無論是牛是羊，既歸耶和華，誰也不可再分別為聖；不潔淨牲畜生的，要按所估的價值加上五分之一贖回，不贖回就按估價賣了。
            basis: [26, 27]
            entries: [頭生歸神]
            why: [26]
          - id: lev27-28
            title: 永獻的不可賣，也不可贖
            refs: ["28-29"]
            topics: [vows]
            summary: 一切永獻的，無論是人、牲畜，或是承受為業的地，都不可賣，也不可贖；凡從人中當滅的都不可贖，必被治死。
            basis: [28, 29]
            why: [28]
      - id: lev27-s4
        title: 十分之一
        verses: 30-33
        laws:
          - id: lev27-30
            title: 地上所有的十分之一歸耶和華，牛羊每第十隻歸耶和華
            refs: ["30-33"]
            topics: [tithes]
            summary: 地上所有的，無論種子或果子，十分之一是耶和華的，歸給耶和華為聖；要贖這十分之一就加上五分之一；牛群羊群中從杖下經過的，每第十隻歸給耶和華為聖，不可問好壞，也不可更換。
            basis: [30, 31, 32, 33]
            why: [30]
