  - {label: "掃羅之死", ref: "代上 10 章"}
  - {label: "大衛作王", ref: "代上 11–29 章"}
  - {label: "所羅門建殿", ref: "代下 1–9 章"}
  - {label: "猶大列王", ref: "代下 10–36 章"}
  - {label: "被擄巴比倫", ref: "代下 36:17–21"}
  - {label: "古列的詔書", ref: "代下 36:22–23"}
mini_intro: 下圖把南北兩國的王照年代排在一起，顏色是經文對他們的評語。北國的王幾乎都是紅色；猶大有好有壞，好王當中也有許多帶著但書或後來轉變。
