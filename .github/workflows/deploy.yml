name: Deploy Quartz to GitHub Pages

"on":
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "quartz/**"
      - "plugins/**"
      - "quartz.ts"
      - "quartz.config.yaml"
      - "quartz.lock.json"
      - "scripts/semantic-index/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # onnxruntime-node 在 Linux 預設會多下載 CUDA 檔（數百 MB）；建置端只用 CPU，跳過
      ONNXRUNTIME_NODE_INSTALL: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check plugin dist is rebuilt
        run: bash .github/scripts/check-plugin-dist.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Quartz build cache
        uses: actions/cache@v4
        with:
          path: .quartz-cache
          key: quartz-build-${{ hashFiles('quartz.config.yaml', 'plugins/**', 'quartz/**') }}
          restore-keys: |
            quartz-build-

      - name: Install dependencies
        run: npm ci

      - name: Detect changed paths
        id: changes
        run: |
          # Check if any non-content file changed (quartz/**, plugins/**, config, etc.)
          CODE_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -vE '^content/' | wc -l | tr -d ' ')
          echo "code_changed=$CODE_CHANGED" >> $GITHUB_OUTPUT
          echo "Changed code files: $CODE_CHANGED"

      - name: Restore public/ output cache
        id: restore-public
        uses: actions/cache@v4
        with:
          path: public
          key: quartz-public-${{ github.sha }}
          restore-keys: |
            quartz-public-

      - name: Prepare Quartz plugins
        # 本地外掛清單與套用 dist 的外掛都在這支腳本裡（deploy.yml 與 smoke.yml 共用，新增外掛只改那裡）
        run: bash .github/scripts/prepare-plugins.sh

      - name: Build interactive websites
        run: |
          python quartz/static/website/build.py --ci-build > build_interactive.log 2>&1 || {
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add build_interactive.log
            git commit -m "chore: upload build log"
            git push origin HEAD
            exit 1
          }

      - name: Build Quartz
        env:
          # Enable incremental mode only when:
          # 1. public/ cache was restored (cache-hit), AND
          # 2. No quartz/plugins/config files changed (content-only push)
          QUARTZ_INCREMENTAL: ${{ steps.restore-public.outputs.cache-hit == 'true' && steps.changes.outputs.code_changed == '0' && '1' || '0' }}
        run: |
          echo "QUARTZ_INCREMENTAL=$QUARTZ_INCREMENTAL"
          npx quartz build --concurrency=2

      - name: Check slim content index
        run: npx tsx quartz/util/checkContentIndex.ts public

      - name: Content check report
        # 首頁進度數字與壞掉的內部連結 → 警告與步驟摘要（U-11：只警告，不擋部署）
        continue-on-error: true
        run: npx tsx quartz/util/checkContent.ts content public

      - name: Verse list check report
        # 經文清單檢查結果 → 警告、步驟摘要、Issue（失敗不擋部署）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node plugins/personal-notes/scripts/verse-check-report.mjs

      - name: Save public/ output cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: public
          key: quartz-public-${{ github.sha }}

      - name: Copy interactive website dist to public
        run: |
          # Only each app's own dist/ (website/<book>/<app>/dist). A bare `-name dist`
          # also matched every dist/ inside node_modules and published ~14 MB of
          # package files per app.
          find quartz/static/website -mindepth 3 -maxdepth 3 -type d -name "dist" | while read dist_dir; do
            dest_dir="public/${dist_dir#quartz/}"
            mkdir -p "$(dirname "$dest_dir")"
            cp -r "$dist_dir" "$(dirname "$dest_dir")/"
          done

      - name: Interactive sites check
        # 互動網站（U-24）：列出缺封面、缺類型、缺 dist 的網站，寫進步驟摘要。只警告不擋部署（U-11）
        continue-on-error: true
        run: npx tsx quartz/util/checkInteractiveSites.ts

      - name: Restore semantic search model cache
        # 模型檔（約 23 MB）只在第一次從 Hugging Face 下載，之後從快取還原
        id: semantic-model-cache
        uses: actions/cache@v4
        with:
          path: .semantic-model-cache
          key: semantic-model-bge-small-zh-v1.5-q8-v1

      - name: Restore semantic search vector cache
        # 增量：以「模型＋頁面文字」的雜湊為鍵，沒改過的頁面不重算
        id: semantic-vectors
        uses: actions/cache/restore@v4
        with:
          path: .semantic-cache
          key: semantic-vectors-${{ github.sha }}
          restore-keys: |
            semantic-vectors-

      - name: Build semantic search index
        # 失敗不擋部署：網站照常上線，只是沒有語意搜尋（前端會處理 manifest 不存在）
        continue-on-error: true
        env:
          SEMANTIC_MODEL_CACHE: .semantic-model-cache
        run: npx tsx scripts/semantic-index/buildIndex.mjs --out public --cache .semantic-cache

      - name: Save semantic search vector cache
        uses: actions/cache/save@v4
        if: always() && steps.semantic-vectors.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .semantic-cache
          key: semantic-vectors-${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
