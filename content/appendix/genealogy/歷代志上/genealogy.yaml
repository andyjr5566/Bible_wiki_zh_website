      mother: 瑪迦
      children: [示別, 特哈拿, {id: 沙亞弗, of: 麥瑪拿}, {id: 示法, of: 抹比拿和基比亞}]
    - ref: "2:49"
      parent: 基路拜
      parent_as: 迦勒
      rel: 女
      children: [押撒]
    - ref: "2:50-51"
      parent: 戶珥
      children: [{id: 朔巴#戶珥, of: 基列耶琳}, {id: 薩瑪, of: 伯利恆}, {id: 哈勒, of: 伯迦得}]
      note: 2:50 開頭說：「迦勒的子孫就是以法他的長子、戶珥的兒子」。
    - ref: "2:52"
      parent: 朔巴#戶珥
