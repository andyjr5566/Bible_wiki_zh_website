# 歷代志上 1–9 章族譜資料（唯一來源；頁面由 ../build_genealogy.py 產生）
#
# 寫法：
#   chain:    [甲, 乙, 丙]          甲生乙、乙生丙
#   parent + children               某人的兒女；mother 標母親；rel 標非「子」的關係（女、妹子、姊妹）
#   roots:                          經文沒交代父親的人
#   places:                         地名清單
#   note:                           白話說明；「」內必須逐字出自所引經節
#   同名不同人用「名#識別」，識別字不顯示。
#   new_parent / new_root：這個父親（鏈首）第一次出現。
#   parent_as / as：經文在這一節的寫法和條目名不同（例如迦勒＝基路拜、雅拉＝耶何阿達）。

book: 歷代志上
scope: [1, 9]
output: appendix/歷代志上的完整人物支線圖.md
title: 歷代志上 1–9 章 人物族譜圖
intro: |
  歷代志上前九章幾乎全是名字，從亞當一路排到被擄歸回、住在耶路撒冷的人。這份圖把這些名字按家族畫出來：先看「總覽」抓大方向，再進各章看細節。

  人名、父子關係、引句和數字都照和合本逐字核對過。這裡只整理經文本身寫了什麼；經文說得不清楚的地方，照字面列出，並在「讀經提醒」說明，不替經文補上推論。
footer: |
  **資料與驗證**：這份頁面由 `appendix/genealogy/歷代志上/` 的資料檔產生（`python appendix/genealogy/build_genealogy.py 歷代志上`），不要直接修改本頁。產生時程式會逐條檢查：每個人名、「某地之祖」、母親的名字、所有「」引句、人數和城名，都必須逐字出現在所引的和合本經節（`raw_scripture/`）；第 1–9 章每一節都要有資料涵蓋。
chapters:
  1: 從亞當到以東列王
  2: 猶大（一）：希斯崙的三個兒子
  3: 大衛的家
  4: 猶大（二）與西緬
  5: 約旦河東的兩個半支派
  6: 利未
  7: 北方各支派
  8: 便雅憫與掃羅家
  9: 歸回後住在耶路撒冷的人

