# 創世記1–50 章（敘事、家譜與預言大多不收；只收其中明文的命令與後來律法回頭引用的規定）。
book: 創世記
chapters:
  - chapter: 1
    excluded:
      - { verses: "1-27", reason: 創世記的敘事、家譜或預言，沒有要百姓遵行的條文 }
      - { verses: "31", reason: 創世記的敘事、家譜或預言，沒有要百姓遵行的條文 }
    sections:
      - id: gen01-s1
        title: 生養眾多
        verses: 28-30
        laws:
          - id: gen01-28
            title: 生養眾多，治理這地；蔬菜果子作人的食物
            refs: ["28-30"]
            topics: [clean-food]
            summary: 神賜福給人，要生養眾多、遍滿地面、治理並管理活物；把結種子的菜蔬和有核果子賜人作食物，青草賜地上活物作食物。
            basis: [28, 29, 30]
  - chapter: 2
    excluded:
      - { verses: "1", reason: 創世記的敘事、家譜或預言，沒有要百姓遵行的條文 }
