  kings_refs: "王下 15:25-31"
  chronicles_refs: "代下 28:5-8"
  prose:
    text: 比加殺了比加轄篡位。他和亞蘭王利汛聯手攻打猶大，歷代志說他「一日殺了猶大人十二萬」。亞述王提革拉毘列色來攻，擄走以色列北方和基列的居民。後來以拉的兒子何細亞背叛他，殺了他。
