# 照順序讀的路線（手寫）。站點是條文 id 的順序。
# 站與站之間不另寫說明：網站用兩站之間的關聯（relations.yaml）和它的證據連結。
# 名稱平實交代內容，不寫成「X：Y」的標語。
- id: slave-freedom
  title: 被賣的弟兄什麼時候自由
  intro: 出埃及記、利未記、申命記都談到被賣的弟兄什麼時候可以自由，三處說法不完全一樣。
  stops: [ex21-02, lev25-39, deut15-12]
- id: sabbath
  title: 十誡裡的安息日
  intro: 十誡在出埃及記和申命記各記了一次，安息日這一條說的理由不一樣。
  stops: [ex20-08, deut5-12]
- id: weak
  title: 照顧寄居的、孤兒寡婦和窮人
  intro: 出埃及記二十二、二十三章對寄居的、孤兒寡婦和窮人有好幾條吩咐，這一路照經文的順序讀。
  stops: [ex22-21, ex22-22, ex22-25, ex22-26, ex23-10]
- id: festivals
  title: 一年三個節期，利未記和申命記各怎麼說
  intro: 利未記二十三章和申命記十六章都記了逾越節、七七節和住棚節。這一路照一年裡的先後，每個節期先讀利未記，再讀申命記。
  stops: [lev23-05, deut16-01, lev23-15, deut16-09, lev23-34, deut16-13]
- id: priest-garments
  title: 祭司的聖衣有哪幾件
  intro: 出埃及記二十八章吩咐給亞倫和他的兒子做聖衣。這一路照經文的順序，一件一件讀。
  stops: [ex28-01, ex28-06, ex28-15, ex28-31, ex28-36, ex28-39]
