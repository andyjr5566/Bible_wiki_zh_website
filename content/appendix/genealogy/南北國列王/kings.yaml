    class: bad_to_good
    basis: 王上
    items:
      - {book: 王上, role: 評語, quote: 暗利的兒子亞哈行耶和華眼中看為惡的事，比他以前的列王更甚, ref: "王上 16:30"}
      - {book: 王上, role: 轉變, quote: 亞哈在我面前這樣自卑, ref: "王上 21:29"}
  synchronism:
    - {quote: 猶大王亞撒三十八年，暗利的兒子亞哈登基作了以色列王, ref: "王上 16:29"}
  kings_refs: "王上 16:29-22:40"
  chronicles_refs: "代下 18:1-34, 代下 21:6, 代下 22:2-5"
  prose:
    text: 亞哈是暗利的兒子，作王二十二年。他娶西頓王的女兒耶洗別，在撒瑪利亞為巴力建廟築壇。王后耶洗別為他設計害死拿伯、奪了葡萄園；以利亞宣告災禍，亞哈就撕裂衣服、禁食，耶和華說「因他在我面前自卑」，要把禍延到他兒子的時候。後來他不聽先知米該雅的話，上基列的拉末打仗，中箭而死。
    refs: "王上 16:29-22:40, 代下 18:1-34"
  notes:
    - text: 亞哈自卑以後，第 22 章仍不聽先知米該雅的話。這裡依王上 21:29 經文明說的「自卑」歸為壞轉好。
      refs: "王上 21:29, 王上 22:8-28"

- id: 亞哈謝#以色列
