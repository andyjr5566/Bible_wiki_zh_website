    text: 耶羅波安是約阿施的兒子，作王四十一年。他照先知約拿的話，收回以色列的疆界，從哈馬口直到亞拉巴海。阿摩司在他作王的時候說預言；伯特利的祭司亞瑪謝向他告狀，說「阿摩司在以色列家中圖謀背叛你」。
    refs: "王下 14:23-29, 摩 1:1, 摩 7:10-13"

