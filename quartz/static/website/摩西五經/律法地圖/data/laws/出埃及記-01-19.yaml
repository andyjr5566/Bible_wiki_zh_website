      - { verses: "16-25", reason: 神降臨在西乃山、百姓聽見角聲的敘事 }
    sections:
      - id: ex19-s1
        title: 在西乃山下預備
        verses: 10-15
        laws:
          - id: ex19-10
            title: 百姓要自潔，洗衣服，不可上山，不可親近女人
            refs: ["10-15"]
            topics: [corpse, one-god]
            summary: 叫百姓今天明天自潔、洗衣，預備第三天耶和華降臨西乃山；山四圍定界，不可上山或摸山，違者治死；角聲拖長才可到山根；不可親近女人。
            basis: [10, 11, 12, 13, 14, 15]
            why: [11]
