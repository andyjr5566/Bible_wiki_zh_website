    title: 雅各把外邦神像和耳環藏在橡樹底下
    ref: 創35:4
    summary: 雅各吩咐家人除掉中間的外邦神，眾人把神像和耳朵上的環子交給雅各，雅各都藏在示劍那裡的橡樹底下。
  - era: 2
    title: 約書亞將一塊大石頭立在橡樹下
