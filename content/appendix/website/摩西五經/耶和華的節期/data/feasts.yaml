# 頁尾「聖經裡還有的節期」：不是神藉摩西吩咐、所以不在故事裡的節期與禁食日（使用者 2026-10-11 要求加上，每項說明是什麼、怎麼來的）。
# refs 的經文由建置腳本從 raw_scripture 取出並顯示；note 裡「」的引文必須逐字出現在 refs 的經文中。
# 註釋只具名轉述、不加引號；sources 列出用到的 raw_data 檔（進頁尾來源清單）。
others:
  title: 聖經裡還有的節期
  intro: 這個網站只收神藉摩西吩咐的節期。聖經後面還提到幾個節期和禁食的日子，不是摩西律法定下的，所以沒有放進上面的故事。
  items:
    - name: 普珥日
      refs: [斯3:7, 斯9:1, 斯9:20-22, 斯9:24, 斯9:26-28]
      note: 亞哈隨魯王的時候，哈曼設謀要殺盡各省的猶大人，在他面前「掣普珥，就是掣籤」，擇定十二月亞達月動手。到了亞達月十三日，仇敵盼望轄制猶大人，猶大人反倒轄制恨他們的人。末底改寫信給各省的猶大人，囑咐每年守亞達月十四、十五兩日，紀念「脫離仇敵得平安、轉憂為喜」；猶大人照著「普珥的名字」稱這兩日為普珥日，應承自己與後裔「每年按時必守這兩日」。這是猶大人自己應承要守的日子，不是神藉摩西吩咐的。
    - name: 修殿節
      refs: [約10:22-23]
      sources: [biblehub_study_daniel_8]
      note: 新約只提到一句：冬天修殿節的時候，耶穌在殿裡所羅門的廊下行走。這個節期的由來，和合本舊約沒有記載。BibleHub 研經註解在但以理書 8 章說明：安提阿古禁止猶太人的敬拜、污穢了聖殿；後來猶大·馬加比和跟隨他的人潔淨聖殿，重新把它獻給神，修殿節就是紀念這件事，約翰福音 10 章提到的正是這個節。
    - name: 四月、五月、七月、十月的禁食
      refs: [亞7:3, 亞7:5, 亞8:19, 王下25:1, 王下25:3-4, 王下25:8-9, 王下25:22, 王下25:25]
      sources: [ccbiblestudy_CT_zechariah_8]
      note: 經文沒有說這四個禁食是誰定的，只記下有人問祭司和先知：「歷年以來，在五月間哭泣齋戒」，現在還要這樣行嗎？黃迦勒註解說，這四個月都對應耶路撒冷陷落時的大事：十月初十巴比倫王開始圍城，四月初九城被攻破，五月初七聖殿被焚，七月間省長基大利被殺；猶太人後來在這些月份禁食哀悼作為紀念。耶和華反問，這七十年在五月、七月禁食悲哀，豈是向他禁食？又藉撒迦利亞說，這些禁食的日子必變為「歡喜快樂的日子和歡樂的節期」。
    - name: 耶羅波安定的八月節期
      refs: [王上12:20, 王上12:26-29, 王上12:32-33]
      note: 以色列眾人立耶羅波安作王，只有猶大支派仍順從大衛家。耶羅波安心裡怕百姓上耶路撒冷的殿獻祭，心會歸回猶大王羅波安，就鑄造兩個金牛犢，一隻安在伯特利，一隻安在但；又定八月十五日為節期，「像在猶大的節期一樣」，在伯特利向牛犢獻祭。經文說這是他「私自所定的月日」。