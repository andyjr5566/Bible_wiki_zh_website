    topics:
      - { id: homicide, name: 殺人與逃城, plain: 殺人與逃城, entry: 逃城 }
      - { id: injury, name: 傷害與賠償, plain: 傷了人要賠 }
      - { id: theft, name: 偷竊與看管, plain: 偷竊與代人保管 }
      - { id: loans, name: 借貸與利息, plain: 借錢與利息 }
